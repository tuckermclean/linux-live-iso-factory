name: Build

# NOTE on tag pushes: this workflow used to also trigger directly on `push:
# tags: ['*']`. That's now handled by .github/workflows/release.yml instead,
# which calls this workflow via `workflow_call` for tags matching `v*.*.*`.
# Keeping a tag trigger here too would mean every release tag kicks off TWO
# independent full builds (one direct, one via release.yml) racing to write
# the same S3 keys and each producing its own attestation/SLSA signature for
# what should be a single, unambiguous release artifact. `workflow_call`
# makes this workflow reusable as a library — release.yml is the ONLY tag
# entry point now; this file is the ONLY definition of how a build+attest
# happens.
on:
  push:
    branches: [master]
  # Full build as a PR check, but ONLY when the PR carries the 'full-ci' label
  # (gated in the `changes` job below). This keeps the expensive Gentoo build
  # off every push while still letting a maintainer demand end-to-end proof on
  # a PR. `labeled` fires the run when the label is added; `synchronize` re-runs
  # it on subsequent pushes to an already-labeled PR.
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
  workflow_call:
    outputs:
      build-version:
        description: >-
          Resolved BUILD_VERSION for this run — the tag with its leading 'v'
          stripped (tag builds) or '<epoch>-<short-sha>' (all other triggers).
          Same value used for S3 object keys, the ISO filename, and
          attestation-summary.json's build_tag.
        value: ${{ jobs.build.outputs.build-version }}
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  packages: write

# Cancel a superseded run for the SAME pull request when a new commit is pushed,
# so rapid pushes to a 'full-ci'-labeled PR don't stack expensive builds. Non-PR
# events (push to master, schedule, workflow_dispatch, and workflow_call from
# release.yml) get a unique per-run group, so they never cancel one another.
concurrency:
  group: >-
    build-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  changes:
    runs-on: ubuntu-latest
    # On pull_request, only run the (expensive) build chain when the PR is
    # labeled 'full-ci'. Every other event runs normally. Gating the root job
    # cascades the skip to build-image → build → boot-test → attestation via
    # their `needs:`, so no label means no full build on the PR.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    outputs:
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dockerfile:
              - 'Dockerfile'
            packages:
              - 'configs/portage/world'
              - 'configs/portage/versions.lock'
              - 'configs/overlay/**'
              - 'scripts/**'
              - 'rootfs/**'

  build-image:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      packages: write
    outputs:
      image-changed: ${{ steps.gate.outputs.image-exists == 'true' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cheap change-detection: instead of pulling the (multi-GB) builder image
      # just to inspect a label, ask the registry for the manifest of the exact
      # tag `make build-image` would produce (`docker manifest inspect` fetches
      # only the manifest, not the layers). If the Dockerfile didn't change AND
      # that tag already exists, the image we'd build is byte-identical to what's
      # already published, so we can skip straight past ensure-dirs/build/push.
      # TAG comes from `make print-registry-tag` (not re-derived here) so the
      # hash logic has exactly one source of truth: Makefile's REGISTRY_TAG.
      - name: Gate on whether the image already exists
        id: gate
        run: |
          set -euo pipefail
          TAG=$(make -s print-registry-tag REGISTRY="${{ env.REGISTRY }}")
          echo "==> Resolved registry tag: $TAG"
          if [ "${{ needs.changes.outputs.dockerfile }}" != "true" ] && \
             docker manifest inspect "${{ env.REGISTRY }}/monolith-builder:$TAG" >/dev/null 2>&1; then
            echo "==> Dockerfile unchanged and $TAG already exists in the registry — skipping build"
            echo "image-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "==> Dockerfile changed or $TAG not found in the registry — building"
            echo "image-exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ensure-dirs
        if: steps.gate.outputs.image-exists != 'true'
        run: make ensure-dirs

      # Warm buildx's LOCAL --cache-from tags before a real build. `make
      # build-image` (Makefile) passes --cache-from monolith-builder-base-tools
      # (IMAGE_NAME/BASE_TOOLS_IMAGE) — a purely local docker tag, not the
      # registry image — so without this pull+retag the base-tools/toolchain
      # stage rebuilds with zero layer cache on every Dockerfile-changing
      # build (the only path that reaches here now that the gate above
      # short-circuits the unchanged case). Gated to the build path so the
      # gate's short-circuit win on the unchanged case is preserved.
      - name: Warm docker layer cache from :latest (build path only)
        if: steps.gate.outputs.image-exists != 'true'
        run: |
          docker pull ${{ env.REGISTRY }}/monolith-builder:latest || true
          docker tag ${{ env.REGISTRY }}/monolith-builder:latest monolith-builder || true
          docker pull ${{ env.REGISTRY }}/monolith-builder-base-tools:latest || true
          docker tag ${{ env.REGISTRY }}/monolith-builder-base-tools:latest monolith-builder-base-tools || true

      - name: Build image
        if: steps.gate.outputs.image-exists != 'true'
        run: make build-image
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Upload crossdev logs on failure
        if: failure() && steps.gate.outputs.image-exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crossdev-logs-${{ github.run_id }}
          path: output/portage-logs/
          retention-days: 7

      # Publish the image tags after EVERY successful build-image, not only when
      # the toolchain was rebuilt. The `build` and `attestation` jobs run on fresh
      # runners and get the image solely via `make pull-image` ->
      # `docker pull $(REGISTRY_IMAGE):$(REGISTRY_TAG)`, so that tag must exist in
      # the registry on every run. When the gate above finds the tag already
      # published, this step (and the build it would push) is skipped entirely —
      # the tag is already there, which is precisely why we short-circuited.
      - name: Push images
        if: steps.gate.outputs.image-exists != 'true'
        run: make push-image
        env:
          REGISTRY: ${{ env.REGISTRY }}

  build:
    runs-on: ubuntu-latest
    needs: [changes, build-image]
    permissions:
      contents: read
      # write: this job pushes the epoch's binpkg cache to GHCR as an OCI
      # artifact (scripts/binpkg-store.sh push) — see the "Save binary
      # package cache to GHCR" step below.
      packages: write
    if: >
      needs.changes.outputs.packages == 'true' ||
      needs.build-image.outputs.image-changed == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/')
    outputs:
      build-started-on: ${{ steps.set-version.outputs.build-started-on }}
      build-version: ${{ steps.set-version.outputs.build-version }}
      publish-latest: ${{ steps.publish.outputs.publish-latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build version
        id: set-version
        run: |
          BUILD_EPOCH=$(grep '^ARG BUILD_EPOCH=' Dockerfile | cut -d= -f2)
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> "$GITHUB_ENV"
          # GHCR requires a lowercase image path; github.repository_owner /
          # $GITHUB_REPOSITORY_OWNER preserve the owner's actual casing (which
          # can be mixed-case for a user account), so lowercase it once here
          # rather than at every scripts/binpkg-store.sh call site.
          echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          BUILD_STARTED_ON=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILD_STARTED_ON=$BUILD_STARTED_ON" >> "$GITHUB_ENV"
          echo "build-started-on=$BUILD_STARTED_ON" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BUILD_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            BUILD_VERSION="$BUILD_EPOCH-$(git rev-parse --short HEAD)"
          fi
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "build-version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `oras` isn't preinstalled on GitHub-hosted runners. Pinned release
      # tarball rather than `go install` (no Go toolchain on this runner) —
      # follows the upstream install snippet at https://oras.land/docs/installation/.
      # Reuses the docker/login-action credential helper entry this job's "Log
      # in to GHCR" step just wrote to ~/.docker/config.json — oras authenticates
      # against ghcr.io the same way `docker` does, no separate `oras login`.
      - name: Install oras
        run: |
          set -euo pipefail
          ORAS_VERSION=1.2.0
          curl -fsSL -o oras.tar.gz \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          mkdir -p oras-install
          tar -zxf oras.tar.gz -C oras-install
          sudo mv oras-install/oras /usr/local/bin/oras
          rm -rf oras.tar.gz oras-install
          oras version

      - name: Pull images
        run: make pull-image
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - run: make ensure-dirs ensure-volume

      - name: Sync portage
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: make sync-portage

      # Binpkg cache is a single OCI artifact per epoch on GHCR
      # (ghcr.io/<owner>/monolith-binpkgs:<epoch>) — one GET instead of the old
      # per-object `aws s3 sync` of the whole packages/<epoch> tree. `pull`
      # fails OPEN: an epoch that's never been pushed yet (e.g. this build's
      # first run, or a brand-new BUILD_EPOCH) leaves output/packages/ empty
      # and the build just compiles from source, same as an S3 miss did
      # before. See scripts/binpkg-store.sh.
      - name: Pull binary package cache from GHCR
        run: bash scripts/binpkg-store.sh pull "$GHCR_OWNER" "$BUILD_EPOCH" output/packages

      - name: Purge stale savedconfig binpkgs
        # Delete any savedconfig-governed binpkg (e.g. busybox) whose config has
        # changed since it was cached, so the build recompiles it from source.
        # Portage's binpkg reuse ignores savedconfig contents, so without this a
        # config edit is silently a no-op. Runs AFTER the GHCR pull above so it
        # acts on the freshly-unpacked local store. See scripts/savedconfig-cache.sh.
        run: bash scripts/savedconfig-cache.sh check output/packages

      - name: Build packages
        run: |
          while true; do echo "=== $(date) ==="; df -h; free -h; echo "---"; sleep 60; done &
          make build-packages JOBS=2 LOAD_AVG=2

      # On a package build failure, upload the per-package build logs.
      # scripts/build-packages.sh copies each failed package's
      # /var/tmp/portage/.../temp/build.log to output/logs/<cat>_<pkg>.build.log
      # (+ emerge-parallel.log) before the ephemeral container exits — those hold
      # the real "configure: error:" / compiler output that portage's "econf/emake
      # failed" console die message omits.
      - name: Upload package build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-build-logs-${{ github.run_id }}
          path: output/logs/
          retention-days: 7
          if-no-files-found: warn

      # Build/ship assertion for the sp1-nic-zoo `=m` NIC drivers (design doc
      # §7). The boot-test NIC-model matrix only proves 6 of the 21 new
      # symbols actually work (the ones QEMU can emulate); this step is the
      # authoritative catch for a symbol silently dropped by the kernel's
      # `olddefconfig` — especially the retirement-prone ISA ones, which have
      # no boot-test coverage at all. `make build-packages` populates
      # output/sysroot/ (see scripts/build-packages.sh), so the modules are
      # already on disk here, before rootfs/ISO assembly even starts.
      - name: Assert NIC kernel modules built and shipped
        run: |
          set -euo pipefail
          KVER=$(grep '^sys-kernel/monolith-kernel:' configs/portage/versions.lock | cut -d: -f2 | sed -E 's/-r[0-9]+$//')
          LOCALVERSION=$(grep '^CONFIG_LOCALVERSION=' configs/kernel.config | sed -E 's/^CONFIG_LOCALVERSION="(.*)"$/\1/')
          MODDIR="output/sysroot/lib/modules/${KVER}${LOCALVERSION}"
          echo "==> Checking for NIC .ko modules under ${MODDIR}"
          if [ ! -d "$MODDIR" ]; then
            echo "::error::Module directory not found: $MODDIR"
            exit 1
          fi
          # Representative set of the new `=m` NIC and netfilter symbols
          # (configs/kernel.config): the risky ISA drivers first, then the PCI
          # zoo, then the netfilter/nftables modules.
          MODULES=(
            ne wd smc-ultra lance 3c509
            pcnet32 tulip via-rhine natsemi sis900
            e1000 e1000e igb sky2 r8169 vmxnet3
            nf_conntrack nf_nat nf_tables nft_ct nft_nat nft_masq nf_defrag_ipv4
          )
          MISSING=()
          for m in "${MODULES[@]}"; do
            if [ -z "$(find "$MODDIR" -name "${m}.ko*" -print -quit)" ]; then
              MISSING+=("$m")
            fi
          done
          if [ "${#MISSING[@]}" -ne 0 ]; then
            echo "::error::Missing NIC kernel modules under ${MODDIR}: ${MISSING[*]}"
            exit 1
          fi
          echo "==> All ${#MODULES[@]} NIC modules present under ${MODDIR}"

      - name: Take ownership of the binpkg tree
        if: always()
        # `make build-packages` runs IN-CONTAINER as root, so output/packages is
        # root-owned. The savedconfig-mark + prune/pack steps below run on the
        # runner as NON-root and must write/delete there — without this they hit
        # "Permission denied" (the savedconfig marker fails to write; prune can't
        # rm superseded gpkgs). Hand the tree to the runner user. build-rootfs
        # later still reads these binpkgs fine (it runs as root in-container).
        run: sudo chown -R "$(id -u):$(id -g)" output/packages

      - name: Record savedconfig hashes
        if: always()
        # Record each tracked savedconfig's hash next to its (now-current) binpkg
        # so the next build's purge step sees a match and reuses it. Runs BEFORE
        # prune/pack/push below so the marker travels inside the packed artifact.
        run: bash scripts/savedconfig-cache.sh mark output/packages

      # Replaces the old whole-tree `aws s3 sync` save: prune superseded gpkgs
      # first (keep only the newest PVR per CAT/PN, plus versions.lock pins) so
      # the artifact only ever carries current-best binpkgs, then pack + push a
      # single OCI artifact to GHCR. `if: always()` — partial progress from a
      # failed build (whatever packages DID finish) is still worth caching for
      # the next run, same as the old S3 save's always-run behavior.
      - name: Save binary package cache to GHCR
        if: always()
        # Best-effort, fail-OPEN: the GHCR binpkg store is a build ACCELERATOR,
        # not a deliverable. A prune/pack/push hiccup must NOT fail an otherwise
        # good build (rootfs/ISO/attestation) — worst case the next build just
        # compiles from source. The outcome is surfaced as a notice/warning so a
        # persistently failing push is still visible in the run summary.
        run: |
          bash scripts/binpkg-store.sh prune output/packages \
            || echo "::warning::binpkg prune failed (non-fatal)"
          if ! bash scripts/binpkg-store.sh pack output/packages; then
            echo "::warning::binpkg pack failed (non-fatal) — skipping push"
            exit 0
          fi
          if bash scripts/binpkg-store.sh push "$GHCR_OWNER" "$BUILD_EPOCH"; then
            echo "::notice::binpkg cache pushed to GHCR (epoch $BUILD_EPOCH)"
          else
            echo "::warning::binpkg cache push failed (non-fatal) — next build compiles from source"
          fi

      - name: Determine whether to publish 'latest' pointers
        # Only master and tag builds overwrite the public themonolith.iso/.squashfs/
        # .vmlinuz/.initrd "latest" pointers. Branch and workflow_dispatch validation
        # builds still upload their versioned artifacts, but must NOT clobber the live
        # public download while a change is still being validated.
        #
        # id + if: always() so this still runs (and PUBLISH_LATEST/publish-latest are
        # still set) even when an earlier build step failed — the "Save build logs to
        # S3" step below needs that on a failed master/tag build, and the separate
        # attestation job's S3-write steps key off the publish-latest job output.
        id: publish
        if: always()
        run: |
          if [ "$GITHUB_REF" = "refs/heads/master" ] || [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "PUBLISH_LATEST=true" >> "$GITHUB_ENV"
            echo "publish-latest=true" >> "$GITHUB_OUTPUT"
            echo "==> Publishing 'latest' pointers (ref: $GITHUB_REF)"
          else
            echo "PUBLISH_LATEST=false" >> "$GITHUB_ENV"
            echo "publish-latest=false" >> "$GITHUB_OUTPUT"
            echo "==> Validation build (ref: $GITHUB_REF): versioned artifacts only, 'latest' preserved."
          fi

      - name: Save build logs to S3
        if: always() && env.PUBLISH_LATEST == 'true'
        run: aws s3 sync output/logs/ s3://${{ secrets.S3_BUCKET }}/builds/$BUILD_VERSION/logs/

      - name: Save kernel image to S3
        if: env.PUBLISH_LATEST == 'true'
        run: |
          if [ -f output/vmlinuz ]; then
            cp output/vmlinuz output/themonolith-$BUILD_VERSION.vmlinuz
            aws s3 cp output/themonolith-$BUILD_VERSION.vmlinuz s3://${{ secrets.S3_BUCKET }}/themonolith-$BUILD_VERSION.vmlinuz
            # server-side copy — no runner egress
            aws s3 cp s3://${{ secrets.S3_BUCKET }}/themonolith-$BUILD_VERSION.vmlinuz s3://${{ secrets.S3_BUCKET }}/themonolith.vmlinuz
          fi

      - name: Build rootfs
        run: make build-rootfs JOBS=2 LOAD_AVG=2

      - name: Cache squashfs for downstream jobs (in-run handoff)
        uses: actions/cache/save@v4
        with:
          path: output/themonolith-${{ env.BUILD_VERSION }}.squashfs
          key: ci-artifacts-${{ github.run_id }}-squashfs

      - name: Save squashfs to S3
        if: env.PUBLISH_LATEST == 'true'
        run: |
          if [ -f output/themonolith-$BUILD_VERSION.squashfs ]; then
            aws s3 cp output/themonolith-$BUILD_VERSION.squashfs s3://${{ secrets.S3_BUCKET }}/themonolith-$BUILD_VERSION.squashfs
            # server-side copy — no runner egress
            aws s3 cp s3://${{ secrets.S3_BUCKET }}/themonolith-$BUILD_VERSION.squashfs s3://${{ secrets.S3_BUCKET }}/themonolith.squashfs
          fi

      - name: Save initrd to S3
        if: env.PUBLISH_LATEST == 'true'
        run: |
          if [ -f output/themonolith-$BUILD_VERSION.initrd ]; then
            aws s3 cp output/themonolith-$BUILD_VERSION.initrd s3://${{ secrets.S3_BUCKET }}/themonolith-$BUILD_VERSION.initrd
            # server-side copy — no runner egress
            aws s3 cp s3://${{ secrets.S3_BUCKET }}/themonolith-$BUILD_VERSION.initrd s3://${{ secrets.S3_BUCKET }}/themonolith.initrd
          fi

      - name: Build ISO
        run: make iso

      - name: Cache ISO for downstream jobs (in-run handoff)
        uses: actions/cache/save@v4
        with:
          path: output/themonolith-${{ env.BUILD_VERSION }}.iso
          key: ci-artifacts-${{ github.run_id }}-iso

      - name: Upload ISO to S3
        if: env.PUBLISH_LATEST == 'true'
        run: |
          aws s3 cp output/themonolith-$BUILD_VERSION.iso s3://${{ secrets.S3_BUCKET }}/themonolith-$BUILD_VERSION.iso
          # server-side copy — no runner egress
          aws s3 cp s3://${{ secrets.S3_BUCKET }}/themonolith-$BUILD_VERSION.iso s3://${{ secrets.S3_BUCKET }}/themonolith.iso
          echo "==> Uploaded versioned + latest ISO"

  # Actually boots the ISO in QEMU (BIOS, UEFI, and toram+eject) and proves it
  # reaches a working shell before anything downstream treats this build as
  # releasable. See .github/workflows/boot-test.yml and scripts/boot-test.py.
  #
  # release.yml (tag-triggered publish) calls this ENTIRE workflow via
  # `workflow_call` rather than depending on this job directly — GitHub
  # Actions `needs:` cannot cross workflow files, and reusing the whole file
  # (rather than just this job) means release.yml's gate on
  # `needs.<this-call>.result == 'success'` already covers boot-test AND
  # attestation AND the build itself failing, with zero duplicated logic.
  boot-test:
    needs: build
    if: needs.build.result == 'success'
    uses: ./.github/workflows/boot-test.yml
    with:
      build-version: ${{ needs.build.outputs.build-version }}
    secrets: inherit

  attestation:
    runs-on: ubuntu-latest
    needs: [build-image, build, boot-test]
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    if: >
      always() &&
      needs.build-image.result == 'success' &&
      needs.build.result == 'success' &&
      needs.boot-test.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Set build version
        run: |
          BUILD_EPOCH=$(grep '^ARG BUILD_EPOCH=' Dockerfile | cut -d= -f2)
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> "$GITHUB_ENV"
          echo "BUILD_STARTED_ON=${{ needs.build.outputs.build-started-on }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "BUILD_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "BUILD_VERSION=$BUILD_EPOCH-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi
          # Capture the stage3 manifest digest — tag is epoch-pinned so pulling
          # now yields the same image used at build time; no rebuild required.
          docker pull "gentoo/stage3:amd64-openrc-${BUILD_EPOCH}" -q 2>/dev/null || true
          STAGE3_DIGEST=$(docker inspect "gentoo/stage3:amd64-openrc-${BUILD_EPOCH}" \
            --format '{{index .RepoDigests 0}}' 2>/dev/null \
            | grep -oP '(?<=@)sha256:\S+' || echo "")
          echo "STAGE3_DIGEST=${STAGE3_DIGEST}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: make pull-image
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - run: make ensure-dirs ensure-volume

      - name: Install squashfs-tools
        run: sudo apt-get install -y squashfs-tools

      - name: Restore squashfs from in-run cache
        uses: actions/cache/restore@v4
        with:
          path: output/themonolith-${{ env.BUILD_VERSION }}.squashfs
          key: ci-artifacts-${{ github.run_id }}-squashfs
          fail-on-cache-miss: true

      - name: Extract sysroot from squashfs
        run: |
          unsquashfs -d output/sysroot output/themonolith-$BUILD_VERSION.squashfs

      - name: Restore ISO from in-run cache
        uses: actions/cache/restore@v4
        with:
          path: output/themonolith-${{ env.BUILD_VERSION }}.iso
          key: ci-artifacts-${{ github.run_id }}-iso
          fail-on-cache-miss: true

      - name: Compute weekly Grype DB cache key
        id: grype-cache-key
        run: echo "week=$(date -u +%Y-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore/save Grype DB cache
        # actions/cache only caches host paths, not the named Docker volume
        # `grype db update` writes into locally — GRYPE_CACHE_DIR (Makefile)
        # redirects it to this workspace dir instead. Keyed weekly so `grype
        # db update` only pulls deltas on a hit; a miss (or partial hit via
        # restore-keys) just falls through to a normal full update below —
        # this is a correctness cache, it must never fail the job.
        uses: actions/cache@v4
        with:
          path: output/grype-db
          key: grype-db-${{ steps.grype-cache-key.outputs.week }}
          restore-keys: |
            grype-db-

      - name: Update Grype DB
        run: make grype-db-update GRYPE_CACHE_DIR=output/grype-db

      - name: Run attestation pipeline
        # GRYPE_CACHE_DIR must match the value used by the "Update Grype DB"
        # step above — the CVE scan inside attestation.sh reads from the same
        # bind-mounted dir the update just wrote into.
        run: make attestation BUILD_VERSION=$BUILD_VERSION GRYPE_CACHE_DIR=output/grype-db
        continue-on-error: true
        env:
          # Bucket name only (no credentials) — used to build the SBOM's
          # "distribution" externalReference URL for the ISO artifact.
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

      - name: Read attestation gate verdict
        id: verdict
        if: always()
        # Surface the pass/fail verdict BEFORE the signing step so we never
        # issue a public Sigstore attestation for a build that failed the
        # CVE/license/unowned gate.
        run: |
          SUMMARY=output/attestation/attestation-summary.json
          if [ -f "$SUMMARY" ]; then
            OVERALL=$(python3 -c "import json; print(json.load(open('$SUMMARY')).get('overall','fail'))")
          else
            OVERALL="fail"
          fi
          echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"
          echo "==> Attestation gate verdict: $OVERALL"

      - name: Restore pip cache for check-jsonschema
        # Runner-side (not builder-image) cache: the validate step below runs
        # python3 -m pip on the GitHub-hosted runner, not in the container, so
        # baking check-jsonschema into the builder image wouldn't help. Keyed
        # on the pinned version — a version bump naturally busts the cache. A
        # miss just means a normal (slower) download in the install step next;
        # this is a tooling cache, it must never fail the job.
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-check-jsonschema-0.38.0

      - name: Validate CycloneDX SBOM schema
        if: always()
        run: |
          set -uo pipefail
          python3 -m pip install --user --quiet check-jsonschema==0.38.0 \
            || python3 -m pip install --user --break-system-packages --quiet check-jsonschema==0.38.0

          # Schemas are vendored in configs/attestation/schemas/ (committed),
          # each with "$id" already stripped. The published schemas set "$id"
          # to a cyclonedx.org URL, so check-jsonschema would otherwise resolve
          # the relative $refs (spdx/jsf) against that URL and fetch them over
          # the network at validation time — which once hung the job for
          # hours. With "$id" removed, the refs resolve to these local files
          # via --base-uri below. See configs/attestation/schemas/README for
          # provenance and how to add a new bom-X.schema.json if specVersion
          # ever moves past 1.6.
          SCHEMA_DIR="$(pwd)/configs/attestation/schemas"

          validate_sbom() {
            local sbom_file="$1"
            [[ -f "$sbom_file" ]] || { echo "==> $sbom_file not found, skipping"; return 0; }
            local spec_version
            spec_version=$(python3 -c "import json; print(json.load(open('${sbom_file}')).get('specVersion','1.6'))")
            local schema="bom-${spec_version}.schema.json"
            if [[ ! -f "${SCHEMA_DIR}/${schema}" ]]; then
              # Genuinely missing vendored schema — a repo bug, not a transient
              # miss. Die loud instead of falling back to a network fetch.
              echo "::error::No vendored CycloneDX schema for specVersion ${spec_version} (expected ${SCHEMA_DIR}/${schema}). Vendor it — see configs/attestation/schemas/README."
              return 1
            fi
            echo "==> Validating ${sbom_file} against CycloneDX ${spec_version} schema (offline, vendored)"
            local rc=0
            # --base-uri resolves $refs to the local schema files (no network).
            # The SBOM is a package SBOM (enrich-sbom.py drops file components), so
            # this validates in ~1s; a timeout here is a real failure, not skipped.
            timeout 180 python3 -m check_jsonschema \
              --base-uri "file://${SCHEMA_DIR}/" \
              --schemafile "${SCHEMA_DIR}/${schema}" "$sbom_file" || rc=$?
            if [[ $rc -eq 124 ]]; then
              echo "::error::CycloneDX schema validation timed out (unexpected — the SBOM should be small)"
            fi
            return $rc
          }

          FAIL=0
          validate_sbom output/attestation/bom.cdx.json || FAIL=1
          validate_sbom output/attestation/builder-bom.cdx.json || FAIL=1
          exit $FAIL

      - name: Read SLSA predicate
        id: read-predicate
        if: always()
        run: |
          PREDICATE=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('output/attestation/slsa-provenance.json'))
              print(json.dumps(d['predicate']))
          except Exception as e:
              print(f'Error reading predicate: {e}', file=sys.stderr)
              sys.exit(1)
          ")
          echo "predicate=$PREDICATE" >> "$GITHUB_OUTPUT"

      - name: Sign SLSA provenance (Sigstore via GitHub OIDC)
        # Only sign when the gate verdict is PASS. Otherwise a build that failed
        # the CVE/license/unowned gate would still get a public Sigstore
        # attestation, and `gh attestation verify` on its ISO would read green.
        uses: actions/attest@v2
        if: always() && steps.read-predicate.outcome == 'success' && steps.verdict.outputs.overall == 'pass'
        with:
          subject-path: output/themonolith-${{ env.BUILD_VERSION }}.iso
          predicate-type: https://slsa.dev/provenance/v1
          predicate: ${{ steps.read-predicate.outputs.predicate }}

      - name: Upload attestation artifacts to S3
        # Only master/tag builds write to S3 — see the 'build' job's "Determine
        # whether to publish 'latest' pointers" step, which sets this job output.
        # Validation (branch/PR) builds must leave zero S3 footprint.
        if: needs.build.outputs.publish-latest == 'true'
        run: |
          aws s3 sync output/attestation/ \
            s3://${{ secrets.S3_BUCKET }}/attestation/$BUILD_VERSION/

      - name: Generate and upload site
        # Same gate as above: this overwrites the public dashboard, so it must not
        # run on validation builds.
        if: needs.build.outputs.publish-latest == 'true'
        run: |
          # Sync only the small per-build attestation-summary.json files from S3 —
          # generate-dashboard.py only ever rglobs attestation-summary.json to build
          # builds-index.json, so full SBOMs/provenance history don't need to be
          # downloaded here.
          mkdir -p output/all-attestation
          aws s3 sync s3://${{ secrets.S3_BUCKET }}/attestation/ output/all-attestation/ \
            --exclude "*" --include "*/attestation-summary.json"

          # Generate builds-index.json + copy static SPA assets into output/web/
          make dashboard ATTEST_INPUT_DIR=output/all-attestation

          # Deploy the SPA to the bucket root — the canonical (and only) dashboard
          # location. web/app/data.js fetches builds-index.json + attestation
          # records from absolute S3_ROOT URLs, so the SPA lives at root. The old
          # /dashboard/ path is retired (see PR); nothing publishes there anymore.
          aws s3 sync output/web/ s3://${{ secrets.S3_BUCKET }}/ \
            --exclude "attestation/*" --exclude "packages/*" --exclude "builds/*"

      - name: Fail if attestation failed
        run: |
          SUMMARY=output/attestation/attestation-summary.json
          if [ ! -f "$SUMMARY" ]; then
            echo "::error::attestation-summary.json not found — attestation did not produce output"
            exit 1
          fi
          OVERALL=$(python3 -c "import json; print(json.load(open('$SUMMARY')).get('overall','fail'))")
          if [ "$OVERALL" != "pass" ]; then
            echo "::error::Attestation failed (overall=$OVERALL) — see s3://${{ secrets.S3_BUCKET }}/attestation/$BUILD_VERSION/"
            exit 1
          fi
