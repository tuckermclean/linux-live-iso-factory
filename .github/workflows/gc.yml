name: S3 GC
on:
  schedule: [{ cron: '0 4 * * 0' }]   # Sundays 04:00 UTC
  workflow_dispatch:
    inputs:
      apply: { description: "Actually delete (else dry-run). Note: the weekly schedule always applies.", type: boolean, default: false }
jobs:
  gc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Determine current epoch
        run: echo "KEEP_EPOCH=$(grep '^ARG BUILD_EPOCH=' Dockerfile | cut -d= -f2)" >> "$GITHUB_ENV"
      # Apply on the weekly schedule; manual dispatch stays dry-run unless apply=true.
      # s3-gc.sh has an abort guard (refuses to delete if the keep-list matches 0
      # objects), so an unattended scheduled apply cannot mass-delete on a mis-set
      # bucket/epoch.
      - name: GC (applies on schedule; dry-run on manual dispatch unless apply=true)
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: sh scripts/s3-gc.sh ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply)) && '--apply' || '' }}
      - name: GHCR GC (applies on schedule; dry-run on manual dispatch unless apply=true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/ghcr-gc.sh ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply)) && '--apply' || '' }}
