name: Release

# Publish-only pipeline. It runs AFTER the Build workflow finishes on a version
# tag and turns that build's already-attested artifacts into a GitHub Release.
# Pushing a `vMAJOR.MINOR.PATCH` tag (optionally with a pre-release suffix like
# `-rc1`) is still the ONLY operator action that cuts a release — see
# docs/releasing.md.
#
# WHY workflow_run, and not `push: tags` calling build.yml: GitHub binds a
# Sigstore attestation to the workflow that TRIGGERED the run. When this file
# built AND signed by calling build.yml via `workflow_call`, the attest step
# failed to persist — "Invalid Argument - values do not match: build.yml !=
# release.yml" — because the certificate's SAN was build.yml but the persist
# API validated the entry point, release.yml. So build.yml now owns the tag
# trigger and does the build + attest itself (see its header), and this workflow
# waits for that Build run to complete, then publishes. There is still exactly
# ONE build per release and ONE definition of build+attest (build.yml); this
# file only cuts the Release.
#
# This workflow does NOT build or re-sign anything. It downloads the ISO, SBOM,
# and attestation-summary.json that build.yml already produced and pushed to S3,
# then independently re-hashes the ISO as a tamper check on the S3 round-trip.
# The digest-chain invariant (sha256(ISO) == SBOM metadata.component.hashes[0]
# == SLSA provenance subject digest) was established INSIDE the Build run
# (scripts/attestation.sh computes the ISO's SHA-256 once and feeds it to both
# enrich-sbom.py and generate-provenance.py, and actions/attest signs over the
# literal ISO with that hash) — this workflow never recomputes or re-derives it,
# it only reads it back and re-checks it before publishing. See
# docs/releasing.md for the full trace.

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

# One release per tag; never cancel an in-flight publish.
concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

# This workflow only creates the GitHub Release. Build + attest (which needs
# id-token/attestations) happens in the Build run this one waits on, so the
# only permission required here is writing the release.
permissions:
  contents: write

jobs:
  publish:
    # Publish ONLY for a SUCCESSFUL Build run that was triggered by pushing a
    # version tag. workflow_run fires for EVERY Build completion (master pushes,
    # 'full-ci' PRs, the weekly schedule, workflow_dispatch); this gate narrows
    # it to v-prefixed tag pushes. For a tag push, github.event.workflow_run
    # .head_branch carries the tag name (e.g. `v0.1.0-rc1`); the resolve step
    # below re-verifies that against the actual tag as a defensive check. If the
    # gated Build FAILED (bad boot-test, CVE/license/unowned gate, or the attest
    # step), conclusion != 'success' and nothing is published.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the exact commit the Build ran on, so the changelog and
          # version resolution below operate on the released tree.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Resolve version + previous tag
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.workflow_run.head_branch }}"

          # Defensive: only publish if head_branch names a real tag that points
          # at the exact commit the Build built. This guards against a branch
          # named `v*`, a mislabeled workflow_run payload, or a tag moved after
          # the build — any mismatch refuses to publish rather than releasing an
          # artifact that doesn't correspond to this tag.
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} is not a tag in this repository — refusing to publish."
            exit 1
          fi
          TAG_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          BUILT_SHA="${{ github.event.workflow_run.head_sha }}"
          if [[ "${TAG_SHA}" != "${BUILT_SHA}" ]]; then
            echo "::error::Tag ${TAG} points at ${TAG_SHA} but the Build ran on ${BUILT_SHA} — refusing to publish."
            exit 1
          fi

          BUILD_VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "build-version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

          # Nearest ancestor tag reachable from this tag's parent commit.
          # Empty on the very first release (no prior tag reachable) —
          # docs/releasing.md documents that v0.0.1 is the pre-release
          # baseline and v0.1.0 is the first public release, so this SHOULD
          # resolve to v0.0.1 for that first cut.
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          echo "prev-tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          if [[ -n "${PREV_TAG}" ]]; then
            echo "==> Version ${BUILD_VERSION} (tag ${TAG}), previous tag: ${PREV_TAG}"
          else
            echo "==> Version ${BUILD_VERSION} (tag ${TAG}), no previous tag found — full history"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download release artifacts from S3
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build-version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          aws s3 cp "s3://${{ secrets.S3_BUCKET }}/themonolith-${BUILD_VERSION}.iso" \
            "release-assets/themonolith-${BUILD_VERSION}.iso"
          aws s3 cp "s3://${{ secrets.S3_BUCKET }}/attestation/${BUILD_VERSION}/bom.cdx.json" \
            "release-assets/bom.cdx.json"
          aws s3 cp "s3://${{ secrets.S3_BUCKET }}/attestation/${BUILD_VERSION}/attestation-summary.json" \
            "attestation-summary.json"

      - name: Verify digest-chain invariant before publishing
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build-version }}
        run: |
          set -euo pipefail
          # The Build run this workflow just gated on already established
          # sha256(ISO) == SBOM metadata.component.hashes[0].content == SLSA
          # subject digest, all from the SAME sha256sum computed once inside
          # scripts/attestation.sh. This step doesn't re-derive that chain —
          # it independently re-hashes the ISO we just downloaded and checks
          # it against attestation-summary.json's recorded value, as a
          # tamper/corruption check on the S3 round-trip, before that hash
          # goes into the release notes and SHA256SUMS.
          COMPUTED_SHA256=$(sha256sum "release-assets/themonolith-${BUILD_VERSION}.iso" | cut -d' ' -f1)
          RECORDED_SHA256=$(python3 -c "import json; print(json.load(open('attestation-summary.json'))['iso_sha256'])")
          echo "==> Computed:  ${COMPUTED_SHA256}"
          echo "==> Recorded:  ${RECORDED_SHA256}"
          if [[ "${COMPUTED_SHA256}" != "${RECORDED_SHA256}" ]]; then
            echo "::error::ISO SHA-256 mismatch between the downloaded artifact and attestation-summary.json — refusing to publish a release whose digest chain doesn't hold."
            exit 1
          fi
          SBOM_SHA256=$(python3 -c "import json; print(json.load(open('release-assets/bom.cdx.json'))['metadata']['component']['hashes'][0]['content'])")
          echo "==> SBOM component hash: ${SBOM_SHA256}"
          if [[ "${SBOM_SHA256}" != "${RECORDED_SHA256}" ]]; then
            echo "::error::SBOM metadata.component hash does not match attestation-summary.json — refusing to publish."
            exit 1
          fi
          echo "iso-sha256=${COMPUTED_SHA256}" >> "$GITHUB_OUTPUT"
        id: digest

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum *.iso bom.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Read kernel + BusyBox versions
        id: pkgversions
        run: |
          KERNEL_VERSION=$(grep '^sys-kernel/monolith-kernel:' configs/portage/versions.lock | cut -d: -f2)
          BUSYBOX_VERSION=$(grep '^sys-apps/busybox:' configs/portage/versions.lock | cut -d: -f2)
          echo "kernel=${KERNEL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "busybox=${BUSYBOX_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog since previous tag
        id: changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREV_TAG: ${{ steps.version.outputs.prev-tag }}
        run: |
          {
            echo "changelog<<CHANGELOG_EOF"
            if [[ -n "${PREV_TAG}" ]]; then
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..${TAG}"
            else
              echo "- Initial release."
            fi
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BUILD_VERSION: ${{ steps.version.outputs.build-version }}
          PREV_TAG: ${{ steps.version.outputs.prev-tag }}
          ISO_SHA256: ${{ steps.digest.outputs.iso-sha256 }}
          KERNEL_VERSION: ${{ steps.pkgversions.outputs.kernel }}
          BUSYBOX_VERSION: ${{ steps.pkgversions.outputs.busybox }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          {
            echo "## The Monolith ${TAG}"
            echo ""
            echo "Kernel \`${KERNEL_VERSION}\` · BusyBox \`${BUSYBOX_VERSION}\` · musl / Gentoo crossdev, i486 target"
            echo ""
            echo "### Verify"
            echo ""
            echo '```bash'
            echo "gh attestation verify themonolith-${BUILD_VERSION}.iso --owner tuckermclean"
            echo '```'
            echo ""
            echo "ISO SHA-256:"
            echo ""
            echo '```'
            echo "${ISO_SHA256}"
            echo '```'
            echo ""
            echo "This is the same digest recorded in the SLSA provenance subject and in \`bom.cdx.json\`'s \`metadata.component.hashes[0]\` — SBOM, SLSA attestation subject, and \`sha256sum\` on the file you download are all the same value by construction (see docs/releasing.md)."
            echo ""
            echo "### Dashboard"
            echo ""
            echo "Full build detail, per-package CVE/license status, and comparison against the previous build:"
            echo "https://${{ secrets.S3_BUCKET }}.s3.amazonaws.com/#/build/${BUILD_VERSION}"
            echo ""
            echo "### Changelog"
            if [[ -n "${PREV_TAG}" ]]; then
              echo ""
              echo "Since \`${PREV_TAG}\`:"
            fi
            echo ""
            echo "${CHANGELOG}"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A SemVer pre-release tag carries a hyphen suffix (v0.1.0-rc1,
          # -beta.2, -alpha): mark it --prerelease and NEVER Latest. GitHub's
          # API rejects a prerelease being "Latest" ("Latest release cannot be
          # draft or prerelease", HTTP 422), so pass --latest=false explicitly
          # rather than let gh try to auto-promote it. Surfacing the newest
          # build to users is the DASHBOARD's job (generate-dashboard.py sorts
          # by build timestamp, so the RC's build shows as LATEST there); the
          # GitHub "Latest" badge only ever rides a final vX.Y.Z release, which
          # gh marks Latest by default.
          RELEASE_FLAGS=()
          case "${TAG#v}" in
            *-*)
              RELEASE_FLAGS+=(--prerelease --latest=false)
              echo "==> ${TAG}: pre-release — publishing as prerelease, NOT Latest (GitHub forbids a prerelease being Latest; the dashboard surfaces the newest build)"
              ;;
            *)
              echo "==> ${TAG}: final release — publishing as Latest (gh default)"
              ;;
          esac
          gh release create "${TAG}" \
            "${RELEASE_FLAGS[@]}" \
            --title "The Monolith ${TAG}" \
            --notes-file release-notes.md \
            release-assets/themonolith-*.iso \
            release-assets/SHA256SUMS \
            release-assets/bom.cdx.json

      - name: Upload SHA256SUMS to S3 (mirrors attestation/<version>/ layout)
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build-version }}
        run: |
          aws s3 cp release-assets/SHA256SUMS \
            "s3://${{ secrets.S3_BUCKET }}/attestation/${BUILD_VERSION}/SHA256SUMS"
