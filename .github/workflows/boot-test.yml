name: Boot Test

# Reusable workflow: actually boots the ISO in QEMU and proves it reaches a
# working shell, over BIOS (ISOLINUX), UEFI (GRUB + OVMF), and the `toram`
# path (+ CD-eject survival). This is the gate that "no release without a
# proven boot" hangs off of.
#
# `workflow_call` (rather than a plain job block in build.yml) is deliberate:
# GitHub Actions `needs:` can only reference jobs in the SAME workflow file,
# so a future release workflow (Task 3 — see note in build.yml) cannot
# depend on a job defined inside build.yml directly. By making this a
# reusable workflow, both build.yml and a future release.yml can each add:
#
#   boot-test:
#     needs: [...]
#     uses: ./.github/workflows/boot-test.yml
#     with:
#       build-version: ${{ ... }}
#     secrets: inherit
#
# and gate their own next step on `needs.boot-test.result == 'success'`,
# with zero duplication of the actual QEMU logic.

on:
  workflow_call:
    inputs:
      build-version:
        description: "BUILD_VERSION whose ISO should be restored from the in-run cache and boot-tested"
        required: true
        type: string

jobs:
  # Shared setup: compute the expected `uname -r` string from the same
  # ground truth the kernel build itself uses, so it's never hardcoded here.
  #   KERNEL_VERSION comes from configs/portage/versions.lock
  #   (sys-kernel/monolith-kernel:<version>:<slot>) — same source Makefile
  #   uses for KERNEL_VERSION.
  #   CONFIG_LOCALVERSION is baked into the kernel via configs/kernel.config
  #   and is appended verbatim to `uname -r` (CONFIG_LOCALVERSION_AUTO is
  #   off, so there's no extra git-suffix to account for).
  expected-kernel:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: compute
        run: |
          # Strip the Portage revision (-rN): it's a packaging bump, not part
          # of the kernel's own release string. `uname -r` reports the source
          # version + CONFIG_LOCALVERSION (e.g. 6.12.80-i486-monolith), so the
          # -r1 in versions.lock's monolith-kernel:6.12.80-r1 must be removed.
          KVER=$(grep '^sys-kernel/monolith-kernel:' configs/portage/versions.lock | cut -d: -f2 | sed -E 's/-r[0-9]+$//')
          LOCALVERSION=$(grep '^CONFIG_LOCALVERSION=' configs/kernel.config | sed -E 's/^CONFIG_LOCALVERSION="(.*)"$/\1/')
          echo "version=${KVER}${LOCALVERSION}" >> "$GITHUB_OUTPUT"
          echo "==> Expected uname -r: ${KVER}${LOCALVERSION}"

  bios:
    needs: expected-kernel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ram_mb: [64, 256]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Install pexpect
        run: pip install pexpect

      - name: Restore ISO from in-run cache
        uses: actions/cache/restore@v4
        with:
          path: output/themonolith-${{ inputs.build-version }}.iso
          key: ci-artifacts-${{ github.run_id }}-iso
          fail-on-cache-miss: true

      - name: Boot test — BIOS (ISOLINUX), ${{ matrix.ram_mb }}M RAM
        run: |
          python3 scripts/boot-test.py \
            --iso "output/themonolith-${{ inputs.build-version }}.iso" \
            --mode bios \
            --ram-mb ${{ matrix.ram_mb }} \
            --kernel-version "${{ needs.expected-kernel.outputs.version }}" \
            --log-file "output/boot-test-bios-${{ matrix.ram_mb }}m.log"

      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-bios-${{ matrix.ram_mb }}m-${{ github.run_id }}
          path: output/boot-test-bios-${{ matrix.ram_mb }}m.log
          retention-days: 14
          if-no-files-found: warn

  uefi:
    needs: expected-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Install pexpect
        run: pip install pexpect

      - name: Restore ISO from in-run cache
        uses: actions/cache/restore@v4
        with:
          path: output/themonolith-${{ inputs.build-version }}.iso
          key: ci-artifacts-${{ github.run_id }}-iso
          fail-on-cache-miss: true

      - name: Boot test — UEFI (GRUB + OVMF)
        run: |
          python3 scripts/boot-test.py \
            --iso "output/themonolith-${{ inputs.build-version }}.iso" \
            --mode uefi \
            --kernel-version "${{ needs.expected-kernel.outputs.version }}" \
            --log-file "output/boot-test-uefi.log"

      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-uefi-${{ github.run_id }}
          path: output/boot-test-uefi.log
          retention-days: 14
          if-no-files-found: warn

  toram-eject:
    needs: expected-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Install pexpect
        run: pip install pexpect

      - name: Restore ISO from in-run cache
        uses: actions/cache/restore@v4
        with:
          path: output/themonolith-${{ inputs.build-version }}.iso
          key: ci-artifacts-${{ github.run_id }}-iso
          fail-on-cache-miss: true

      # toram is exercised via BIOS/ISOLINUX only — GRUB's (toram) menuentry
      # has no console=ttyS0, so it isn't reachable over serial. See the
      # module docstring in scripts/boot-test.py for the full reasoning.
      - name: Boot test — toram + CD eject survival
        run: |
          python3 scripts/boot-test.py \
            --iso "output/themonolith-${{ inputs.build-version }}.iso" \
            --mode toram \
            --kernel-version "${{ needs.expected-kernel.outputs.version }}" \
            --log-file "output/boot-test-toram.log"

      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-toram-${{ github.run_id }}
          path: output/boot-test-toram.log
          retention-days: 14
          if-no-files-found: warn

  # --------------------------------------------------------------------
  # Phase-2 Tier-1 module-regime variants: each boots the isohybrid ISO
  # (a valid raw disk image, not just a CD image) from a different
  # emulated storage controller and asserts the matching kernel module
  # was coldplug-loaded from the initrd before the squashfs was mounted.
  # See the module docstring in scripts/boot-test.py for the full
  # reasoning and exact QEMU device sets.
  # --------------------------------------------------------------------

  ahci:
    needs: expected-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Install pexpect
        run: pip install pexpect

      - name: Restore ISO from in-run cache
        uses: actions/cache/restore@v4
        with:
          path: output/themonolith-${{ inputs.build-version }}.iso
          key: ci-artifacts-${{ github.run_id }}-iso
          fail-on-cache-miss: true

      - name: Boot test — AHCI/SATA (q35 + ich9-ahci, UEFI)
        run: |
          python3 scripts/boot-test.py \
            --iso "output/themonolith-${{ inputs.build-version }}.iso" \
            --mode ahci \
            --ram-mb 512 \
            --kernel-version "${{ needs.expected-kernel.outputs.version }}" \
            --log-file "output/boot-test-ahci.log"

      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-ahci-${{ github.run_id }}
          path: output/boot-test-ahci.log
          retention-days: 14
          if-no-files-found: warn

  nvme:
    needs: expected-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Install pexpect
        run: pip install pexpect

      - name: Restore ISO from in-run cache
        uses: actions/cache/restore@v4
        with:
          path: output/themonolith-${{ inputs.build-version }}.iso
          key: ci-artifacts-${{ github.run_id }}-iso
          fail-on-cache-miss: true

      - name: Boot test — NVMe (UEFI)
        run: |
          python3 scripts/boot-test.py \
            --iso "output/themonolith-${{ inputs.build-version }}.iso" \
            --mode nvme \
            --ram-mb 512 \
            --kernel-version "${{ needs.expected-kernel.outputs.version }}" \
            --log-file "output/boot-test-nvme.log"

      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-nvme-${{ github.run_id }}
          path: output/boot-test-nvme.log
          retention-days: 14
          if-no-files-found: warn

  usb:
    needs: expected-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Install pexpect
        run: pip install pexpect

      - name: Restore ISO from in-run cache
        uses: actions/cache/restore@v4
        with:
          path: output/themonolith-${{ inputs.build-version }}.iso
          key: ci-artifacts-${{ github.run_id }}-iso
          fail-on-cache-miss: true

      - name: Boot test — USB mass storage (xHCI, UEFI)
        run: |
          python3 scripts/boot-test.py \
            --iso "output/themonolith-${{ inputs.build-version }}.iso" \
            --mode usb \
            --ram-mb 512 \
            --kernel-version "${{ needs.expected-kernel.outputs.version }}" \
            --log-file "output/boot-test-usb.log"

      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-usb-${{ github.run_id }}
          path: output/boot-test-usb.log
          retention-days: 14
          if-no-files-found: warn

  virtio:
    needs: expected-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Install pexpect
        run: pip install pexpect

      - name: Restore ISO from in-run cache
        uses: actions/cache/restore@v4
        with:
          path: output/themonolith-${{ inputs.build-version }}.iso
          key: ci-artifacts-${{ github.run_id }}-iso
          fail-on-cache-miss: true

      - name: Boot test — virtio-blk (UEFI)
        run: |
          python3 scripts/boot-test.py \
            --iso "output/themonolith-${{ inputs.build-version }}.iso" \
            --mode virtio \
            --ram-mb 512 \
            --kernel-version "${{ needs.expected-kernel.outputs.version }}" \
            --log-file "output/boot-test-virtio.log"

      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-virtio-${{ github.run_id }}
          path: output/boot-test-virtio.log
          retention-days: 14
          if-no-files-found: warn

  nicless:
    needs: expected-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Install pexpect
        run: pip install pexpect

      - name: Restore ISO from in-run cache
        uses: actions/cache/restore@v4
        with:
          path: output/themonolith-${{ inputs.build-version }}.iso
          key: ci-artifacts-${{ github.run_id }}-iso
          fail-on-cache-miss: true

      # Negative control: no NIC hardware at all (-nic none), proving
      # coldplug does NOT load e1000 when there's nothing to match. See the
      # module docstring in scripts/boot-test.py for the full reasoning.
      - name: Boot test — nicless (negative control, BIOS/ISOLINUX)
        run: |
          python3 scripts/boot-test.py \
            --iso "output/themonolith-${{ inputs.build-version }}.iso" \
            --mode nicless \
            --ram-mb 64 \
            --kernel-version "${{ needs.expected-kernel.outputs.version }}" \
            --log-file "output/boot-test-nicless.log"

      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-nicless-${{ github.run_id }}
          path: output/boot-test-nicless.log
          retention-days: 14
          if-no-files-found: warn

  # NIC-model matrix: BIOS/ISOLINUX boot with each QEMU NIC model in turn.
  # PCI models (pcnet/rtl8139/tulip/ne2k_pci) assert coldplug via modalias;
  # ne2k_isa has no modalias, so it asserts the `monolith-net probe` path
  # instead. See the NIC_MODEL_MODULE comment in scripts/boot-test.py.
  nic-models:
    needs: expected-kernel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nic_model: [pcnet, rtl8139, tulip, ne2k_pci, ne2k_isa]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Install pexpect
        run: pip install pexpect

      - name: Restore ISO from in-run cache
        uses: actions/cache/restore@v4
        with:
          path: output/themonolith-${{ inputs.build-version }}.iso
          key: ci-artifacts-${{ github.run_id }}-iso
          fail-on-cache-miss: true

      - name: Boot test — NIC model ${{ matrix.nic_model }}
        run: |
          python3 scripts/boot-test.py \
            --iso "output/themonolith-${{ inputs.build-version }}.iso" \
            --mode nic --nic-model ${{ matrix.nic_model }} \
            --kernel-version "${{ needs.expected-kernel.outputs.version }}" \
            --log-file "output/boot-test-nic-${{ matrix.nic_model }}.log"

      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-nic-${{ matrix.nic_model }}-${{ github.run_id }}
          path: output/boot-test-nic-${{ matrix.nic_model }}.log
          retention-days: 14
          if-no-files-found: warn

  # Two-node NAT boot test: a router guest (monolith-router on eth0=WAN/user,
  # eth1=LAN/socket) and a client guest on the same LAN socket segment. The
  # client curls a host http.server THROUGH the router's masquerade — proving
  # the whole netfilter/conntrack/NAT/nftables chain (Tasks 1-4) end to end —
  # then a negative control tears NAT down and confirms the reach dies. See
  # run_nat in scripts/boot-test.py for the full orchestration.
  nat-router:
    needs: expected-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Install pexpect
        run: pip install pexpect

      - name: Restore ISO from in-run cache
        uses: actions/cache/restore@v4
        with:
          path: output/themonolith-${{ inputs.build-version }}.iso
          key: ci-artifacts-${{ github.run_id }}-iso
          fail-on-cache-miss: true

      - name: Start host http.server (the client reaches this through NAT)
        run: |
          mkdir -p /tmp/natsrv && echo NAT_OK_marker > /tmp/natsrv/probe.txt
          ( cd /tmp/natsrv && python3 -m http.server 8000 --bind 0.0.0.0 ) &
          echo "HTTP_PID=$!" >> "$GITHUB_ENV"
          sleep 2

      - name: Boot test — two-node NAT (router + client)
        run: |
          python3 scripts/boot-test.py \
            --iso "output/themonolith-${{ inputs.build-version }}.iso" \
            --mode nat \
            --kernel-version "${{ needs.expected-kernel.outputs.version }}" \
            --log-file "output/boot-test-nat.log"

      - name: Stop host http.server
        if: always()
        run: kill "${HTTP_PID}" 2>/dev/null || true

      - name: Upload serial console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-nat-${{ github.run_id }}
          path: output/boot-test-nat.log*
          retention-days: 14
          if-no-files-found: warn
