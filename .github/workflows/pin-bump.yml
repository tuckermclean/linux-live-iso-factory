name: Pin Bump

# Automates the CHEAP, routine BUILD_EPOCH pin lever documented in
# docs/version-pinning.md ("two-pin model"). BUILD_EPOCH is the *runtime*
# portage snapshot pin — bumping it does NOT touch the builder image (that's
# TOOLCHAIN_EPOCH's job; see .github/workflows/toolchain-bump.yml, the
# separate HUMAN-GATED flow for that rarer, consequential bump).
#
# Weekly (and on manual dispatch) this:
#   1. Checks whether a newer stage3/portage snapshot date is available
#      (host-side, no Docker). No-ops with a clear log line if already
#      current. (The stage3 date tag is used purely as the "is there
#      something newer" freshness signal shared with TOOLCHAIN_EPOCH;
#      BUILD_EPOCH itself only pins the runtime portage snapshot.)
#   2. Bumps Dockerfile's BUILD_EPOCH + SOURCE_DATE_EPOCH.
#   3. Archives the new portage snapshot to our S3 mirror
#      (scripts/sync-portage.sh fetch-only) and regenerates
#      configs/portage/versions.lock from it (make sync-portage
#      update-versions) — the same two steps `make update-all` runs
#      locally, automated end to end. Deliberately does NOT run
#      `make build-image` or regenerate configs/portage/crossdev.lock —
#      the image is unchanged by a BUILD_EPOCH-only bump, so rebuilding it
#      would be pure wasted CI time.
#   4. Pushes a branch and dispatches the existing build.yml workflow on it
#      to run the full build + attestation (SBOM/license/CVE) pipeline as
#      validation — build.yml is reused as-is via `gh workflow run`, not
#      duplicated here, so there is exactly ONE definition of "how to build
#      and validate The Monolith". Any job build.yml gains later (e.g. a
#      dedicated CVE-gate job, a boot-test job) is picked up automatically
#      the next time this workflow runs — no changes needed here.
#   5. Opens a PR with the pin diff + validation results. On FULLY-GREEN
#      validation, auto-merges it (`gh pr merge --squash --admin`) — this is
#      the cheap, routine flow: a snapshot bump that passes the exact same
#      full build+boot+attestation pipeline as any other change needs no
#      human in the loop. On any red (or an inconclusive/timed-out
#      validation run), the PR is left open labeled `needs-fixup` and is
#      NEVER auto-merged.

on:
  schedule:
    # Monday 06:00 UTC — three hours after build.yml's own weekly build (Mondays
    # 03:00 UTC per .github/workflows/build.yml), so that run's image/portage cache
    # is warm before this workflow starts touching the same pins.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      target_epoch:
        description: >-
          Force a specific BUILD_EPOCH (YYYYMMDD) instead of using the latest
          available stage3+portage snapshot. Leave empty for normal behavior.
        required: false
        type: string

concurrency:
  group: pin-bump
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # Cheap, host-only gate. Determines whether there is anything to do at all before
  # any Docker/image work happens.
  check:
    runs-on: ubuntu-latest
    outputs:
      update_available: ${{ steps.gate.outputs.update_available }}
      current_epoch: ${{ steps.gate.outputs.current_epoch }}
      target_epoch: ${{ steps.gate.outputs.target_epoch }}
      check_output: ${{ steps.gate.outputs.check_output }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate target_epoch input
        if: github.event_name == 'workflow_dispatch' && inputs.target_epoch != ''
        run: |
          if ! [[ "${{ inputs.target_epoch }}" =~ ^[0-9]{8}$ ]]; then
            echo "::error::target_epoch must be YYYYMMDD, got: ${{ inputs.target_epoch }}"
            exit 1
          fi

      - name: Check build pins
        id: gate
        run: |
          set -euo pipefail

          CURRENT=$(grep '^ARG BUILD_EPOCH=' Dockerfile | cut -d= -f2)
          echo "current_epoch=${CURRENT}" >> "$GITHUB_OUTPUT"

          OUT="$(scripts/update-build-pins.sh check)"
          echo "${OUT}"

          {
            echo "check_output<<PINBUMP_EOF"
            echo "${OUT}"
            echo "PINBUMP_EOF"
          } >> "$GITHUB_OUTPUT"

          FORCED="${{ inputs.target_epoch }}"
          if [[ -n "${FORCED}" ]]; then
            if [[ "${FORCED}" == "${CURRENT}" ]]; then
              echo "==> Forced target epoch (${FORCED}) equals current epoch — no-op."
              echo "update_available=false" >> "$GITHUB_OUTPUT"
            else
              echo "==> Forced target epoch requested: ${CURRENT} -> ${FORCED}"
              echo "update_available=true" >> "$GITHUB_OUTPUT"
              echo "target_epoch=${FORCED}" >> "$GITHUB_OUTPUT"
            fi
          elif echo "${OUT}" | grep -q 'BUILD_EPOCH.*\*'; then
            LATEST=$(echo "${OUT}" | grep 'BUILD_EPOCH' | awk '{print $3}')
            echo "==> Update available: ${CURRENT} -> ${LATEST}"
            echo "update_available=true" >> "$GITHUB_OUTPUT"
            echo "target_epoch=${LATEST}" >> "$GITHUB_OUTPUT"
          else
            echo "==> Already up to date at ${CURRENT} — nothing to do."
            echo "update_available=false" >> "$GITHUB_OUTPUT"
          fi

  bump-and-validate:
    needs: check
    if: needs.check.outputs.update_available == 'true'
    runs-on: ubuntu-latest
    # Budget: ~15min for the snapshot archive + versions.lock regen,
    # ~240min bounded wait for the dispatched build.yml validation run, plus
    # slack. GitHub-hosted runners hard-cap a single job at 360 minutes
    # regardless of this setting — see the "Wait for validation" step, which
    # degrades to a "timed_out" PR status rather than being silently killed.
    timeout-minutes: 280
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      OLD_EPOCH: ${{ needs.check.outputs.current_epoch }}
      NEW_EPOCH: ${{ needs.check.outputs.target_epoch }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure labels exist
        run: |
          gh label create "pin-bump" --color "0e8a16" \
            --description "Automated BUILD_EPOCH pin bump" --force
          gh label create "needs-fixup" --color "d93f0b" \
            --description "Automated pin bump failed or could not complete validation" --force
          gh label create "validated" --color "0e8a16" \
            --description "Automated pin bump passed full build+CVE+boot validation" --force

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: make ensure-dirs

      - name: Pull current builder image
        # Needed to run `make sync-portage`/`make update-versions` (both
        # `docker run` the builder image) — NOT to rebuild it. This flow
        # never runs `make build-image`; the image is pulled as-is, matching
        # what build.yml itself pushed for the current (pre-bump) pins.
        run: make pull-image

      - name: Create branch
        run: git switch -c "pins/bump-${OLD_EPOCH}-${NEW_EPOCH}"

      - name: Bump BUILD_EPOCH + SOURCE_DATE_EPOCH
        run: |
          set -euo pipefail
          scripts/update-build-pins.sh update "${NEW_EPOCH}" 2>&1 | tee /tmp/pin-bump-update.log
          NOW=$(grep '^ARG BUILD_EPOCH=' Dockerfile | cut -d= -f2)
          if [ "$NOW" != "${NEW_EPOCH}" ]; then
            echo "::error::BUILD_EPOCH is $NOW, expected ${NEW_EPOCH} — bump did not apply; aborting."
            exit 1
          fi

      - name: Archive new portage snapshot to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          BUILD_EPOCH="${NEW_EPOCH}" sh scripts/sync-portage.sh fetch-only

      - name: Regenerate versions.lock
        id: update-versions
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          if make sync-portage update-versions; then
            echo "rc=0" >> "$GITHUB_OUTPUT"
          else
            echo "rc=$?" >> "$GITHUB_OUTPUT"
            echo "::warning::make sync-portage update-versions failed for epoch ${NEW_EPOCH}."
          fi

      - name: Compute pin diff summary
        id: diff
        run: |
          # versions.lock is regenerated inside the builder container (via the
          # /configs bind mount), so on the host it is owned by root and the
          # unprivileged runner's `git add` fails to index it ("Permission
          # denied"). Reclaim ownership before staging.
          sudo chown -R "$(id -u):$(id -g)" configs/portage
          git add -A
          git diff --cached --stat -- Dockerfile configs/portage/versions.lock \
            > /tmp/diffstat.txt || true
          git diff --cached -- configs/portage/versions.lock | head -200 > /tmp/versions.diff || true

      - name: Commit and push
        run: |
          git commit -m "chore(pins): bump BUILD_EPOCH ${OLD_EPOCH} -> ${NEW_EPOCH}

          Automated by .github/workflows/pin-bump.yml (cheap snapshot flow —
          no image rebuild; see .github/workflows/toolchain-bump.yml for the
          separate human-gated TOOLCHAIN_EPOCH flow).
          - Dockerfile: BUILD_EPOCH + SOURCE_DATE_EPOCH
          - configs/portage/versions.lock: regenerated ($( [[ '${{ steps.update-versions.outputs.rc }}' == '0' ]] && echo yes || echo 'SKIPPED - see PR body' ))"
          git push -u origin "pins/bump-${OLD_EPOCH}-${NEW_EPOCH}"

      - name: Dispatch full build + validation workflow
        id: dispatch
        if: steps.update-versions.outputs.rc == '0'
        run: |
          set -euo pipefail
          BRANCH="pins/bump-${OLD_EPOCH}-${NEW_EPOCH}"
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build.yml --ref "${BRANCH}"

          echo "==> Waiting for the dispatched run to register..."
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow=build.yml --branch "${BRANCH}" \
              --json databaseId,createdAt,event \
              --jq "[.[] | select(.event==\"workflow_dispatch\" and .createdAt>=\"${BEFORE}\")] | sort_by(.createdAt) | last | .databaseId // empty")
            [[ -n "${RUN_ID}" ]] && break
            sleep 10
          done

          if [[ -z "${RUN_ID}" ]]; then
            echo "::warning::Could not find the dispatched build.yml run — check the Actions tab manually."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "found=true"
              echo "run_id=${RUN_ID}"
              echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for validation run to complete
        id: wait
        if: steps.dispatch.outputs.found == 'true'
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.dispatch.outputs.run_id }}"
          DEADLINE=$(( $(date +%s) + 240*60 ))
          STATUS="in_progress"
          CONCLUSION=""

          while [[ "$(date +%s)" -lt "${DEADLINE}" ]]; do
            STATUS=$(gh run view "${RUN_ID}" --json status --jq .status)
            if [[ "${STATUS}" == "completed" ]]; then
              CONCLUSION=$(gh run view "${RUN_ID}" --json conclusion --jq .conclusion)
              break
            fi
            sleep 60
          done

          if [[ "${STATUS}" != "completed" ]]; then
            echo "conclusion=timed_out" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=${CONCLUSION}" >> "$GITHUB_OUTPUT"
          fi

          gh run view "${RUN_ID}" --json jobs \
            --jq '.jobs[] | "- " + .name + ": " + .conclusion' \
            > /tmp/job-results.txt || echo "(job list unavailable)" > /tmp/job-results.txt

      - name: Assemble PR body
        id: body
        run: |
          {
            echo "## Pin check delta"
            echo '```'
            echo "${{ needs.check.outputs.check_output }}"
            echo '```'
            echo ""
            echo "## Lock diff summary"
            echo '```'
            cat /tmp/diffstat.txt 2>/dev/null || echo "(no diff captured)"
            echo '```'
            echo ""
            echo "<details><summary>configs/portage/versions.lock diff (first 200 lines)</summary>"
            echo ""
            echo '```diff'
            cat /tmp/versions.diff 2>/dev/null
            echo '```'
            echo "</details>"
            echo ""
            echo "## Validation"
            if [[ "${{ steps.update-versions.outputs.rc }}" != "0" ]]; then
              echo "**BLOCKED** — \`make sync-portage update-versions\` failed for epoch ${NEW_EPOCH}"
              echo "(rc=${{ steps.update-versions.outputs.rc }}). versions.lock was not regenerated."
              echo "Full build+CVE+boot validation was NOT run."
            elif [[ "${{ steps.dispatch.outputs.found }}" != "true" ]]; then
              echo "**UNKNOWN** — versions.lock regenerated, but the validation run (\`build.yml\` dispatched on this"
              echo "branch) could not be located. Check the Actions tab manually before merging."
            else
              echo "Full pipeline (build + attestation, which includes the CVE gate — Pillar 3 of"
              echo "\`scripts/attestation.sh\`) dispatched at: ${{ steps.dispatch.outputs.run_url }}"
              echo ""
              echo "Result: **${{ steps.wait.outputs.conclusion }}**"
              echo ""
              echo "Per-job results:"
              cat /tmp/job-results.txt 2>/dev/null || echo "(unavailable)"
              echo ""
              if [[ "${{ steps.wait.outputs.conclusion }}" == "timed_out" ]]; then
                echo "The run did not complete within this workflow's wait budget. It may still be"
                echo "running — check the link above directly."
              fi
              if [[ "${{ steps.wait.outputs.conclusion }}" == "success" ]]; then
                echo ""
                echo "**This PR will be auto-merged** — fully-green validation on a cheap"
                echo "BUILD_EPOCH-only bump (no image rebuild) needs no human in the loop."
              fi
            fi
            echo ""
            echo "---"
            echo "This PR was opened automatically by \`.github/workflows/pin-bump.yml\`."
            echo "It auto-merges on fully-green validation; any red (or unresolved) result leaves"
            echo "it open, labeled \`needs-fixup\`, for manual follow-up per"
            echo "\`docs/version-pinning.md\`."
          } > /tmp/pr-body.md

          LABEL="pin-bump"
          if [[ "${{ steps.update-versions.outputs.rc }}" != "0" ]]; then
            LABEL="${LABEL},needs-fixup"
          elif [[ "${{ steps.dispatch.outputs.found }}" == "true" && "${{ steps.wait.outputs.conclusion }}" == "success" ]]; then
            LABEL="${LABEL},validated"
          else
            LABEL="${LABEL},needs-fixup"
          fi
          echo "labels=${LABEL}" >> "$GITHUB_OUTPUT"

      - name: Open PR
        run: |
          gh pr create \
            --title "chore(pins): bump BUILD_EPOCH ${OLD_EPOCH} -> ${NEW_EPOCH}" \
            --body-file /tmp/pr-body.md \
            --base master \
            --head "pins/bump-${OLD_EPOCH}-${NEW_EPOCH}" \
            --label "${{ steps.body.outputs.labels }}"

      - name: Auto-merge on fully-green validation
        # The whole point of the cheap flow: a BUILD_EPOCH-only bump that
        # passes the exact same full build+boot+attestation pipeline
        # (dispatched above) as any other change is safe to land without a
        # human. Any non-success conclusion (failure, cancelled, timed_out,
        # or the run not being found at all) leaves the PR open with the
        # `needs-fixup` label instead — see the "Open PR" step above.
        #
        # CAVEAT: `--admin` merges by bypassing branch-protection required
        # reviews/checks, which requires the invoking token/actor to hold
        # admin (or an explicit bypass grant) on this repo. The default
        # `GITHUB_TOKEN` acting as `github-actions[bot]` may NOT have that
        # unless the repo's branch protection settings explicitly allow it
        # to bypass. If this step 403s in practice, the PR still exists
        # (opened above) and just needs a manual merge — nothing is lost,
        # but the "cheap flow needs no human" property degrades to
        # "cheap flow still needs one click." Confirm the bypass grant (or
        # switch to `gh pr merge --squash --auto`, which instead waits on
        # branch protection's own required checks against the PR) before
        # relying on this for real.
        if: steps.wait.outputs.conclusion == 'success'
        run: |
          set -euo pipefail
          echo "==> Validation fully green — auto-merging pins/bump-${OLD_EPOCH}-${NEW_EPOCH}"
          gh pr merge "pins/bump-${OLD_EPOCH}-${NEW_EPOCH}" --squash --admin --delete-branch
