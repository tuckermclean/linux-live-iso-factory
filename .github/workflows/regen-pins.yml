name: Regenerate pin lockfiles

# When BUILD_EPOCH is bumped on an integration/pins branch, versions.lock and
# crossdev.lock must be regenerated against the NEW portage snapshot — a step
# that needs Docker + a rebuilt toolchain image. This does that in CI and
# commits the regenerated locks back to the branch, so nobody has to do a
# bandwidth-heavy local crossdev rebuild.
#
# Trigger: push to an integration/pins branch touching the pin files. The
# workflow's own commit is made with GITHUB_TOKEN, which by GitHub design does
# NOT re-trigger workflows — so there is no loop. A human fix-up push (real
# token) to crossdev.lock/versions.lock WILL re-trigger it, which is exactly
# what you want for the toolchain fix-forward loop.
#
# Toolchain chicken-and-egg: build-image needs valid musl/gcc/binutils pins,
# but the correct values come from the new snapshot. We break it by querying
# the pinned gentoo/stage3 image directly (with '*/* ~*' keywords, so LIVE 9999
# ebuilds are excluded — the reason a naive query produced gcc-15.3.9999).

on:
  push:
    branches: ['integration/**', 'pins/**']
    paths:
      - Dockerfile
      - configs/portage/crossdev.lock
      - configs/portage/versions.lock
      - scripts/update-versions.sh
      - scripts/update-build-pins.sh
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: regen-pins-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Resolve toolchain pins from the pinned snapshot (no live ebuilds)
        run: |
          set -euo pipefail
          EPOCH=$(grep '^ARG BUILD_EPOCH=' Dockerfile | cut -d= -f2)
          IMG="gentoo/stage3:amd64-openrc-${EPOCH}"
          echo "Syncing $IMG portage tree (emerge-webrsync --revert=$EPOCH), then querying..."
          docker pull -q "$IMG"
          # stage3 ships NO ebuild tree, so sync the pinned snapshot first (same
          # mechanism the Dockerfile uses). One throwaway container: sync once,
          # set '*/* ~*' keywords (testing, but NOT live 9999 ebuilds), query all
          # three atoms. stage3 is stock (no 'monolith' overlay) → no /configs.
          OUT=$(docker run --rm "$IMG" sh -euc '
            emerge-webrsync --revert='"$EPOCH"' >/tmp/sync.log 2>&1 \
              || { echo "SYNC_FAILED"; tail -n 8 /tmp/sync.log; exit 3; }
            mkdir -p /etc/portage/package.accept_keywords
            echo "*/* ~*" > /etc/portage/package.accept_keywords/zz-regen
            printf "MUSL=%s\n" "$(portageq best_visible / sys-libs/musl 2>/dev/null)"
            printf "GCC=%s\n"  "$(portageq best_visible / "=sys-devel/gcc-15*" 2>/dev/null)"
            printf "BINU=%s\n" "$(portageq best_visible / sys-devel/binutils 2>/dev/null)"
            printf "MUSL_EBUILDS=%s\n" "$(ls /var/db/repos/gentoo/sys-libs/musl/ 2>/dev/null | tr "\n" " ")"
          ' || true)
          echo "$OUT"
          MUSL=$(printf '%s\n' "$OUT" | sed -n 's|^MUSL=sys-libs/musl-||p')
          GCC=$(printf '%s\n'  "$OUT" | sed -n 's|^GCC=sys-devel/gcc-||p')
          BINU=$(printf '%s\n' "$OUT" | sed -n 's|^BINU=sys-devel/binutils-||p')
          echo "queried: musl=${MUSL:-<empty>} gcc=${GCC:-<empty>} binutils=${BINU:-<empty>}"
          # Fall back to the currently-committed pin for anything the query could
          # not resolve (musl barely moves and best_visible can come back empty),
          # rather than failing the whole regen. build-image is the ultimate
          # arbiter of an actually-bad pin.
          CUR_MUSL=$(grep -m1 '^sys-libs/musl:'     configs/portage/crossdev.lock | cut -d: -f2 || true)
          CUR_GCC=$(grep  -m1 '^sys-devel/gcc:'      configs/portage/crossdev.lock | cut -d: -f2 || true)
          CUR_BINU=$(grep -m1 '^sys-devel/binutils:' configs/portage/versions.lock | cut -d: -f2 || true)
          MUSL="${MUSL:-$CUR_MUSL}"
          GCC="${GCC:-$CUR_GCC}"
          BINU="${BINU:-$CUR_BINU}"
          echo "final:   musl=$MUSL gcc=$GCC binutils=$BINU"
          if [ -z "$MUSL" ] || [ -z "$GCC" ] || [ -z "$BINU" ]; then
            echo "::error::empty toolchain pin after fallback (musl=$MUSL gcc=$GCC binutils=$BINU)"; exit 1
          fi
          case "$GCC" in *9999*) echo "::error::resolved a live gcc ($GCC)"; exit 1 ;; esac
          printf '%s\n' \
            "# crossdev.lock — Cross-toolchain version pins" \
            "#" \
            "# Regenerated by .github/workflows/regen-pins.yml from" \
            "# gentoo/stage3:amd64-openrc-${EPOCH} with '*/* ~*' keywords (no live ebuilds)." \
            "# Applied by: make build-image (passed to crossdev --libc / --gcc)" \
            "#" \
            "# Format: category/package:version:slot  (same as versions.lock)" \
            "" \
            "sys-libs/musl:${MUSL}:0" \
            "sys-devel/gcc:${GCC}:${GCC%%.*}" \
            > configs/portage/crossdev.lock
          # binutils is read from versions.lock at build-image time; patch its
          # line so the toolchain build has a valid pin (update-versions below
          # then rewrites the whole file from the freshly-built image anyway).
          sed -i "s|^sys-devel/binutils:.*|sys-devel/binutils:${BINU}:${BINU%.*}|" \
            configs/portage/versions.lock
          echo "--- crossdev.lock ---"; cat configs/portage/crossdev.lock

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: make ensure-dirs ensure-volume

      - name: Pull builder image for cache
        run: make pull-image || true

      - name: Rebuild toolchain image against the pinned epoch
        run: make build-image

      - name: Publish the rebuilt toolchain image to GHCR
        # Don't throw away the ~50min crossdev build: push it so build.yml's
        # build-image job (and the next regen) reuse it as cache instead of
        # rebuilding the toolchain from scratch.
        run: make push-image

      - name: Upload crossdev logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regen-crossdev-logs-${{ github.run_id }}
          path: output/portage-logs/
          retention-days: 7

      - name: Regenerate versions.lock from the rebuilt image
        run: make update-versions

      - name: Reclaim ownership of container-written files
        if: always()
        # make update-versions writes versions.lock from inside a root Docker
        # container (bind-mounted configs/), so it lands root-owned and
        # unreadable to the non-root runner ("Permission denied" on git add /
        # artifact upload). Reclaim ownership before anything reads it.
        run: sudo chown -R "$(id -u):$(id -g)" configs Dockerfile || true

      - name: Upload regenerated locks as an artifact
        if: always()
        # Belt-and-suspenders: even if the push below fails, the regenerated
        # locks are retrievable here without repeating the ~50min rebuild.
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-locks-${{ github.run_id }}
          path: |
            Dockerfile
            configs/portage/versions.lock
            configs/portage/crossdev.lock
          retention-days: 14
          if-no-files-found: warn

      - name: Commit regenerated locks back to the branch
        run: |
          set -euo pipefail
          git config user.name  "monolith-ci[bot]"
          git config user.email "monolith-ci@users.noreply.github.com"
          git add Dockerfile configs/portage/versions.lock configs/portage/crossdev.lock
          if git diff --cached --quiet; then
            echo "No lock changes to commit."
          else
            EPOCH=$(grep '^ARG BUILD_EPOCH=' Dockerfile | cut -d= -f2)
            git commit -m "chore(pins): regenerate versions.lock + crossdev.lock for epoch ${EPOCH} [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
