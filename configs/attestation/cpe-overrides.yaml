# cpe-overrides.yaml
#
# Exception list of CPE corrections for packages where Syft's automatic
# CPE detection is wrong or absent. This is NOT a full package→CPE map —
# only add entries here for packages that Syft gets wrong.
#
# To bootstrap: run `make attestation` once, then check the gap report
# in the enrich-sbom.py stderr output and add corrections as needed.
#
# Format:
#   bare-package-name:
#     vendor: <CPE vendor field>
#     product: <CPE product field>
#
# OR as a full CPE 2.3 string (version will be substituted by enrich-sbom.py):
#   bare-package-name: "cpe:2.3:a:vendor:product:*:*:*:*:*:*:*:*"
#
# Keys are bare package names without category prefix (e.g. "bash" not "app-shells/bash").
#
# Syft generates nonsense CPEs for Gentoo packages by using the Portage atom
# (e.g. "app-shells/bash") as both vendor and product. Every package below is
# a correction to a real NVD-registered CPE that Grype can match against CVEs.
#
# Packages with no NVD presence (acct-group/acct-user virtuals, Gentoo-specific
# metadata packages, dmidecode, htop, etc.) are intentionally omitted — they
# will appear as CPE gaps, which is correct.

overrides:
  # --- Kernel & core C library ---
  monolith-kernel: "cpe:2.3:o:linux:linux_kernel:*:*:*:*:*:*:*:*"
  musl:            "cpe:2.3:a:musl-libc:musl:*:*:*:*:*:*:*:*"

  # --- Shells ---
  bash:            "cpe:2.3:a:gnu:bash:*:*:*:*:*:*:*:*"
  zsh:             "cpe:2.3:a:zsh:zsh:*:*:*:*:*:*:*:*"

  # --- Core utilities (GNU) ---
  coreutils:       "cpe:2.3:a:gnu:coreutils:*:*:*:*:*:*:*:*"
  diffutils:       "cpe:2.3:a:gnu:diffutils:*:*:*:*:*:*:*:*"
  findutils:       "cpe:2.3:a:gnu:findutils:*:*:*:*:*:*:*:*"
  gawk:            "cpe:2.3:a:gnu:gawk:*:*:*:*:*:*:*:*"
  grep:            "cpe:2.3:a:gnu:grep:*:*:*:*:*:*:*:*"
  make:            "cpe:2.3:a:gnu:make:*:*:*:*:*:*:*:*"
  nano:            "cpe:2.3:a:gnu:nano:*:*:*:*:*:*:*:*"
  patch:           "cpe:2.3:a:gnu:patch:*:*:*:*:*:*:*:*"
  sed:             "cpe:2.3:a:gnu:sed:*:*:*:*:*:*:*:*"
  tar:             "cpe:2.3:a:gnu:tar:*:*:*:*:*:*:*:*"
  wget:            "cpe:2.3:a:gnu:wget:*:*:*:*:*:*:*:*"

  # --- Archivers ---
  bzip2:           "cpe:2.3:a:bzip:bzip2:*:*:*:*:*:*:*:*"
  gzip:            "cpe:2.3:a:gnu:gzip:*:*:*:*:*:*:*:*"
  unzip:           "cpe:2.3:a:info-zip:unzip:*:*:*:*:*:*:*:*"
  xz-utils:        "cpe:2.3:a:tukaani:xz:*:*:*:*:*:*:*:*"
  zip:             "cpe:2.3:a:info-zip:zip:*:*:*:*:*:*:*:*"

  # --- Text / terminal ---
  less:            "cpe:2.3:a:greenwoodsoftware:less:*:*:*:*:*:*:*:*"
  ncurses:         "cpe:2.3:a:gnu:ncurses:*:*:*:*:*:*:*:*"
  readline:        "cpe:2.3:a:gnu:readline:*:*:*:*:*:*:*:*"
  tmux:            "cpe:2.3:a:tmux_project:tmux:*:*:*:*:*:*:*:*"

  # --- Editors ---
  # vim-core and xxd are Gentoo splits of the vim upstream; they share the vim CPE.
  # Only vim itself carries the CPE — the splits have no independent NVD entries and
  # would double/triple-report every vim CVE if given the same CPE.
  vim:             "cpe:2.3:a:vim:vim:*:*:*:*:*:*:*:*"

  # --- Crypto / TLS ---
  openssl:         "cpe:2.3:a:openssl:openssl:*:*:*:*:*:*:*:*"

  # --- Libraries ---
  libevent:        "cpe:2.3:a:libevent_project:libevent:*:*:*:*:*:*:*:*"
  glib:            "cpe:2.3:a:gnome:glib:*:*:*:*:*:*:*:*"
  libffi:          "cpe:2.3:a:libffi_project:libffi:*:*:*:*:*:*:*:*"
  libiconv:        "cpe:2.3:a:gnu:libiconv:*:*:*:*:*:*:*:*"
  libpcap:         "cpe:2.3:a:tcpdump:libpcap:*:*:*:*:*:*:*:*"
  libpcre:         "cpe:2.3:a:pcre:pcre:*:*:*:*:*:*:*:*"
  libpcre2:        "cpe:2.3:a:pcre:pcre2:*:*:*:*:*:*:*:*"
  zlib:            "cpe:2.3:a:zlib:zlib:*:*:*:*:*:*:*:*"

  # --- Network tools ---
  curl:            "cpe:2.3:a:haxx:curl:*:*:*:*:*:*:*:*"
  dhcpcd:          "cpe:2.3:a:dhcpcd_project:dhcpcd:*:*:*:*:*:*:*:*"
  # NVD uses the project slug "dropbear_ssh_project", not the author name.
  # Verified against https://nvd.nist.gov/products/cpe/search?keyword=dropbear
  dropbear:        "cpe:2.3:a:dropbear_ssh_project:dropbear_ssh:*:*:*:*:*:*:*:*"
  # NVD CPE dictionary entry is iputils_project, not plain iputils.
  iputils:         "cpe:2.3:a:iputils_project:iputils:*:*:*:*:*:*:*:*"
  iproute2:        "cpe:2.3:a:iproute2_project:iproute2:*:*:*:*:*:*:*:*"
  irssi:           "cpe:2.3:a:irssi:irssi:*:*:*:*:*:*:*:*"
  # NVD registers ppp under point-to-point_protocol_project — NOT the Gentoo
  # metadata.xml hint "samba:ppp" (stale) nor the bare Portage atom. Verified
  # live against CVE-2020-8597's CPE match list.
  ppp:             "cpe:2.3:a:point-to-point_protocol_project:point-to-point_protocol:*:*:*:*:*:*:*:*"
  rsync:           "cpe:2.3:a:samba:rsync:*:*:*:*:*:*:*:*"
  socat:           "cpe:2.3:a:dest-unreach:socat:*:*:*:*:*:*:*:*"
  tcpdump:         "cpe:2.3:a:tcpdump:tcpdump:*:*:*:*:*:*:*:*"
  # NVD coverage for traceroute is sparse; buc:traceroute is the best known
  # entry but may produce no matches. Flagged for manual verification.
  traceroute:      "cpe:2.3:a:buc:traceroute:*:*:*:*:*:*:*:*"

  # --- System management ---
  binutils:        "cpe:2.3:a:gnu:binutils:*:*:*:*:*:*:*:*"
  busybox:         "cpe:2.3:a:busybox:busybox:*:*:*:*:*:*:*:*"
  e2fsprogs:       "cpe:2.3:a:e2fsprogs_project:e2fsprogs:*:*:*:*:*:*:*:*"
  lsof:            "cpe:2.3:a:lsof_project:lsof:*:*:*:*:*:*:*:*"
  procps:          "cpe:2.3:a:procps_project:procps:*:*:*:*:*:*:*:*"
  shadow:          "cpe:2.3:a:shadow-maint:shadow-utils:*:*:*:*:*:*:*:*"
  smartmontools:   "cpe:2.3:a:smartmontools:smartmontools:*:*:*:*:*:*:*:*"
  strace:          "cpe:2.3:a:strace:strace:*:*:*:*:*:*:*:*"
  util-linux:      "cpe:2.3:a:kernel:util-linux:*:*:*:*:*:*:*:*"

  # --- Scripting ---
  lua:             "cpe:2.3:a:lua:lua:*:*:*:*:*:*:*:*"
  # monolith-perl is our custom overlay ebuild (perl-cross-driven static
  # build, see configs/overlay/dev-lang/monolith-perl), but the shipped
  # interpreter is upstream Perl verbatim — CVEs are filed against
  # perl:perl in NVD, not against the overlay package name.
  perl:            "cpe:2.3:a:perl:perl:*:*:*:*:*:*:*:*"
  # CGI.pm 4.10 rider baked into monolith-perl (pure-perl, see the ebuild's
  # CGI_PV comment and the world-file pin comment). Best-effort CPE: NVD's
  # official CPE dictionary registers CGI.pm under vendor "andy_armstrong"
  # (Andy Armstrong co-maintained CGI.pm through the 3.x era before Lee
  # Johnson/LEEJO took over on CPAN) — verified via the NVD CPE search API
  # (services.nvd.nist.gov/rest/json/cpes/2.0?keywordSearch=CGI.pm), which
  # returns only "andy_armstrong:cgi.pm" as a registered vendor:product pair
  # (versions 1.x-3.49+ indexed), the same vendor-lags-current-maintainer
  # pattern as the sqlite/perl entries above. Historical CGI.pm CVEs (e.g.
  # the CRLF-injection family) are filed against this CPE, not perl:perl.
  cgi:             "cpe:2.3:a:andy_armstrong:cgi.pm:*:*:*:*:*:*:*:*"
  # DBI + DBD::SQLite are baked into monolith-perl via static_ext (SP5 P3,
  # un-deferred at -r6, see the monolith-perl ebuild's src_prepare comment
  # for the DBI_PUREPERL unblock), not separate portage packages — added
  # here so Syft/Grype have somewhere to attach a CPE if it ever infers a
  # package name for the bundled module sources.
  # dbi: verified real NVD entry (`services.nvd.nist.gov/rest/json/cpes/2.0
  # ?keywordSearch=perl%20DBI`, re-checked 2026-08-14): vendor "perl",
  # product "dbi".
  dbi:             "cpe:2.3:a:perl:dbi:*:*:*:*:*:*:*:*"
  # dbd_sqlite: NVD has NO registered CPE for DBD::SQLite (re-checked
  # 2026-08-14: `keywordSearch=dbd%3A%3Asqlite` and `dbd_sqlite` both return
  # zero results) — this file's own header says packages with no NVD
  # presence should be omitted (they show as a correct gap), but this entry
  # is kept as a best-effort vendor:product placeholder per explicit
  # request, so `grep dbd` finds it; treat any CVE match against it as
  # unverified until a real NVD CPE shows up. NOTE: the shipped copy is
  # DBD::SQLite's OWN bundled sqlite amalgamation (3.51.1), not
  # monolith-sqlite (3.53.4) — see the monolith-perl ebuild; a future sqlite
  # CVE affecting only 3.51.1 would need to be checked against this embedded
  # copy separately from the `sqlite:` entry below, which only covers the
  # standalone CLI/libsqlite3.a.
  dbd_sqlite:      "cpe:2.3:a:dbd_sqlite:dbd_sqlite:*:*:*:*:*:*:*:*"

  # --- Databases ---
  # monolith-sqlite is our custom overlay ebuild (amalgamation build, see
  # configs/overlay/dev-db/monolith-sqlite), but the shipped bits (sqlite3
  # CLI + libsqlite3.a) are upstream SQLite verbatim — CVEs are filed against
  # sqlite:sqlite in NVD, not against the overlay package name.
  sqlite:          "cpe:2.3:a:sqlite:sqlite:*:*:*:*:*:*:*:*"

  # --- Shells ---
  dash:            "cpe:2.3:a:dash_project:dash:*:*:*:*:*:*:*:*"

  # --- System daemons / init ---
  # infodrom:sysklogd matches historical NVD entries for sysklogd maintainer Infodrom.
  sysklogd:        "cpe:2.3:a:infodrom:sysklogd:*:*:*:*:*:*:*:*"
  sysvinit:        "cpe:2.3:a:sysvinit_project:sysvinit:*:*:*:*:*:*:*:*"

  # --- Interactive / diagnostic tools ---
  file:            "cpe:2.3:a:file_project:file:*:*:*:*:*:*:*:*"
  htop:            "cpe:2.3:a:htop:htop:*:*:*:*:*:*:*:*"
  lynx:            "cpe:2.3:a:lynx:lynx:*:*:*:*:*:*:*:*"
  nethack:         "cpe:2.3:a:nethack:nethack:*:*:*:*:*:*:*:*"

  # --- Debugging ---
  # Gentoo's own metadata.xml declares this upstream CPE directly
  # (<upstream><remote-id type="cpe">cpe:/a:gnu:gdb</remote-id></upstream>).
  gdb:             "cpe:2.3:a:gnu:gdb:*:*:*:*:*:*:*:*"

  # --- Libraries ---
  # NVD CPE dictionary uses vendor "gmplib", not "gnu" — verified against
  # CVE-2021-43618 (GMP mpz/inp_raw.c integer overflow), whose CPE match is
  # cpe:2.3:a:gmplib:gmp:... A naive vendor="gnu" guess (as for gcc/glibc/
  # coreutils elsewhere in this file) would silently fail to match any CVE.
  gmp:             "cpe:2.3:a:gmplib:gmp:*:*:*:*:*:*:*:*"
  # Verified against CVE-2022-40674 (expat use-after-free) — NVD's CPE
  # dictionary product name is "libexpat", not "expat".
  expat:           "cpe:2.3:a:libexpat_project:libexpat:*:*:*:*:*:*:*:*"

  # --- Bootloaders (embedded in ISO, propagated from builder to target SBOM) ---
  # NVD uses gnu:grub2 for GRUB 2.x releases.
  grub:            "cpe:2.3:a:gnu:grub2:*:*:*:*:*:*:*:*"
  # NVD uses hpa:syslinux (H. Peter Anvin is the upstream author/maintainer).
  syslinux:        "cpe:2.3:a:hpa:syslinux:*:*:*:*:*:*:*:*"

  # --- Libraries ---
  popt:            "cpe:2.3:a:rpm:popt:*:*:*:*:*:*:*:*"

  # --- System libraries (often present in builder; relevant CVE targets) ---
  pam:             "cpe:2.3:a:linux-pam_project:linux-pam:*:*:*:*:*:*:*:*"
  libgcrypt:       "cpe:2.3:a:gnupg:libgcrypt:*:*:*:*:*:*:*:*"
  libcap:          "cpe:2.3:a:kernel:libcap:*:*:*:*:*:*:*:*"

  # --- Build tools ---
  bison:           "cpe:2.3:a:gnu:bison:*:*:*:*:*:*:*:*"
  flex:            "cpe:2.3:a:westes:flex:*:*:*:*:*:*:*:*"
  nasm:            "cpe:2.3:a:nasm:nasm:*:*:*:*:*:*:*:*"

  # --- Build toolchain (builder-only; important for CVE scanning of the build env) ---
  # gcc: bare_name of sys-devel/gcc. _p suffix stripped to upstream version.
  gcc:             "cpe:2.3:a:gnu:gcc:*:*:*:*:*:*:*:*"
  # glibc is the builder's host libc (target uses musl).
  glibc:           "cpe:2.3:a:gnu:glibc:*:*:*:*:*:*:*:*"
  # openssh version format: Gentoo 10.2_p1 strips to 10.2; NVD uses 10.2p1.
  # Version may not match exactly but the package is submitted for CVE scanning.
  openssh:         "cpe:2.3:a:openbsd:openssh:*:*:*:*:*:*:*:*"
  libxml2:         "cpe:2.3:a:xmlsoft:libxml2:*:*:*:*:*:*:*:*"
  gnutls:          "cpe:2.3:a:gnu:gnutls:*:*:*:*:*:*:*:*"
  c-ares:          "cpe:2.3:a:c-ares_project:c-ares:*:*:*:*:*:*:*:*"
  git:             "cpe:2.3:a:git-scm:git:*:*:*:*:*:*:*:*"
  python:          "cpe:2.3:a:python:python:*:*:*:*:*:*:*:*"
  perl:            "cpe:2.3:a:perl:perl:*:*:*:*:*:*:*:*"
