# unowned-allowlist.yaml
#
# Files present in the rootfs that are not owned by any Portage package.
# These are suppressed from the Pillar 4 unowned-files gate.
#
# Paths are relative to rootfs root (no leading /).
# fnmatch glob patterns: * matches within a path segment, ** matches across.
#
# Goal: this list shrinks over time as items move into proper ebuilds.

allowlist:
  # ── Build-generated files (created by our scripts / shadow tools, unowned) ──
  - etc/passwd-                        # shadow-util backup of /etc/passwd
  - etc/group-                         # shadow-util backup of /etc/group
  - etc/shadow-                        # shadow-util backup of /etc/shadow
  - etc/gshadow-                       # shadow-util backup of /etc/gshadow
  - etc/profile.d/10-dropbear-hint.sh  # generated by build-rootfs.sh (dropbear login hint)

  # ── FHS structural directories created by build-rootfs.sh ──────────────────
  # Standard mount points and empty directories required by the FHS.
  # Created by build-rootfs.sh mkdir -p; not owned by any Portage package.
  - dev
  - home
  - mnt
  - opt
  - proc
  - root
  - run
  - sys
  - etc/network
  - var/log
  - var/spool

  # ── Portage system directories ──────────────────────────────────────────────
  # Directories created implicitly by the package manager; not owned by any
  # package, but their contents are tracked by the glob patterns below.
  - tmp
  - var/cache
  - var/cache/edb
  - var/db
  - var/db/pkg
  - var/lib/portage
  - var/tmp

  # ── Portage metadata ────────────────────────────────────────────────────────
  # The Portage DB itself is not tracked as owned files
  - var/db/pkg/**
  - var/cache/edb/**
  - var/lib/portage/**

  # ── /etc config files written by build-rootfs.sh ────────────────────────────
  # Pending proper ebuilds
  - etc/passwd
  - etc/group
  - etc/shadow
  - etc/fstab
  - etc/hosts
  - etc/hostname
  - etc/motd
  - etc/issue
  - etc/resolv.conf
  - etc/profile
  - etc/securetty
  - etc/shells
  - etc/inittab
  - etc/network/interfaces

  # ── Init scripts written by build-rootfs.sh ─────────────────────────────────
  - etc/init.d/rcS
  - etc/init.d/rcK
  - etc/init.d/S20keygen
  - etc/init.d/S30gpm
  - etc/init.d/S35netprobe
  - etc/init.d/S40network
  - etc/init.d/S50advisory
  - etc/monolith-release
  - etc/os-release

  # ── Advisory scripts (pending proper ebuilds) ───────────────────────────────
  - usr/sbin/monolith-advisory-check
  - etc/profile.d/monolith-advisory.sh

  # ── Network helper (SP1) — pending monolith-base ebuild ─────────────────────
  # monolith-net wakes pre-Plug-and-Play ISA NICs that emit no modalias; hand-
  # installed by build-rootfs.sh from configs/rootfs-overlay/usr/bin/. Grouped
  # with etc/init.d/S35netprobe above under the SP-base ownership task.
  - usr/bin/monolith-net

  # ── NAT router helper (SP2) — pending monolith-base ebuild ──────────────────
  - usr/sbin/monolith-router

  # ── Lazy console shell — agetty auto-login target; keeps bash off idle
  #    consoles (RAM). Hand-installed by build-rootfs.sh. Pending monolith-base.
  - usr/sbin/monolith-console

  # POSIX-sh `which` — GNU sys-apps/which doesn't build on musl and busybox
  # isn't in the rootfs. Hand-installed by build-rootfs.sh. Pending monolith-base.
  - usr/bin/which

  # ── Guestbook CGI fixture (SP5 P4) — pending monolith-base ebuild ───────────
  # perl + CGI.pm + the sqlite3 CLI LAMP-invariant boot-test fixture (DBI/
  # DBD::SQLite deferred, see configs/portage/world). Hand-installed by
  # build-rootfs.sh from configs/rootfs-overlay/usr/lib/cgi-bin/. See
  # scripts/boot-test.py smoke_guestbook.
  - usr/lib/cgi-bin/guestbook.cgi

  # ── Prompt customisation ─────────────────────────────────────────────────────
  - etc/bash/bashrc.d/99-monolith-square.bash

  # ── Root home — bash skel files copied by build-rootfs.sh ───────────────────
  - root/.bash_profile
  - root/.bashrc
  - root/.bash_logout

  # ── Symlinks set by build-rootfs.sh ─────────────────────────────────────────
  - bin/sh
  - usr/bin/more

  # ── Terminfo case-collision symlinks ────────────────────────────────────────
  # Single-char lowercase → uppercase symlinks created by build-rootfs.sh to fix
  # NTFS case-insensitivity collisions (e.g. l -> L, a -> A)
  - usr/share/terminfo/?

  # ── ld.so.cache — generated by ldconfig in postinst ─────────────────────────
  - etc/ld.so.cache

  # ── var/run and var/lock — symlinks to /run set by build-rootfs.sh ──────────
  - var/run
  - var/lock

  # ── /etc postinst artifacts — written by pkg_postinst hooks, not tracked ────
  # env-update generates profile.env and csh.env from /etc/env.d/ fragments.
  # binutils pkg_postinst writes env.d/05binutils and binutils/config-*.
  # shadow pkg_postinst writes group-, gshadow, subgid, subuid, .pwd.lock.
  # ldconfig writes ld.so.conf.
  # systemd-tmpfiles/environment.d entries come from toolchain postinst.
  - etc/.pwd.lock
  - etc/csh.env
  - etc/env.d/05binutils
  - etc/env.d/binutils/config-*
  - etc/environment.d
  - etc/environment.d/10-gentoo-env.conf
  - etc/group-
  - etc/gshadow
  - etc/ld.so.conf
  - etc/profile.env
  - etc/subgid
  - etc/subuid

  # ── binutils eselect symlinks — managed by binutils-config in pkg_postinst ──
  # binutils-config uses eselect to install these unversioned /usr/bin/
  # wrappers pointing into /usr/lib/binutils/. They are intentionally absent
  # from CONTENTS because eselect manages them dynamically.
  - usr/bin/addr2line
  - usr/bin/ar
  - usr/bin/as
  - usr/bin/c++filt
  - usr/bin/elfedit
  - usr/bin/gprof
  - usr/bin/ld
  - usr/bin/ld.bfd
  - usr/bin/ldd
  - usr/bin/nm
  - usr/bin/objcopy
  - usr/bin/objdump
  - usr/bin/ranlib
  - usr/bin/readelf
  - usr/bin/size
  - usr/bin/strings
  - usr/bin/strip

  # ── binutils-data info/dir — generated by install-info in pkg_postinst ──────
  # The texinfo 'dir' index is regenerated from .info files; not in CONTENTS.
  - usr/share/binutils-data/*/*/info/dir

  # ── nethack runtime state — created on first run ────────────────────────────
  # nethack initializes these files when the game first starts; they are not
  # installed by the ebuild (no pre-existing content to ship).
  - var/games/nethack/logfile
  - var/games/nethack/perm
  - var/games/nethack/record
  - var/games/nethack/xlogfile

  # ── kmod OpenRC service — registered by kmod pkg_postinst, unused here ──────
  # kmod's pkg_postinst runs `rc-update add kmod-static-nodes sysinit`, which
  # creates this OpenRC runlevel tree. The symlink and its parent dirs are not
  # tracked in any package's CONTENTS. We boot with sysvinit (see etc/inittab),
  # so the service never runs — it's harmless, and kmod is here only for its
  # modprobe/lsmod/depmod tools (the Tier-2 coldplug), not its init integration.
  - etc/runlevels
  - etc/runlevels/sysinit
  - etc/runlevels/sysinit/kmod-static-nodes

  # ── Portage news — written by emerge during pkg installation ─────────────────
  # emerge writes news items to var/lib/gentoo/news/ during postinst;
  # the skip/unread tracking files are not owned by any package.
  - var/lib/gentoo/news/news-gentoo.skip
  - var/lib/gentoo/news/news-gentoo.unread

  # ── nftables service state (SP2) — net-firewall/nftables pkg_postinst / its
  # OpenRC service create /var/lib/nftables/rules-save (ruleset persistence for
  # the `nftables` service, which we do NOT use — monolith-router drives nft
  # directly). Not in the package CONTENTS. Pending the monolith-base sweep.
  - var/lib/nftables
  - var/lib/nftables/rules-save
