# gdb-17.2's C++ compile is memory-heavy (large, template-laden translation
# units). With the global MAKEOPTS="-j2" AND emerge --jobs=2 (two packages in
# parallel), its peak RAM OOM-kills the CI runner mid-build — the job dies with
# no error and no build.log (the failure-log upload step never even runs).
# Serialize gdb's INTERNAL make so only one TU compiles at a time: slower, but
# its memory footprint then fits the runner. Only gdb needs this.
MAKEOPTS="-j1"
