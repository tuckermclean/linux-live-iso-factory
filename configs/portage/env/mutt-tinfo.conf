# mutt: link ncurses together with libtinfo.
#
# This repo's sys-libs/ncurses is built with tinfo split into its own library
# (USE=tinfo). A bare `-lncurses` static link therefore leaves the terminfo
# symbols (tgetent, cur_term, setupterm, ...) unresolved, and mutt's autoconf
# curses probe (AC_CHECK_LIB(ncurses, initscr)) fails its test link — reported
# as "configure: error: no curses library found". mtr sidesteps this via a
# Gentoo tinfo patch; mutt has none. Appending -ltinfo to LIBS makes the
# `-lncurses` conftest resolve (order: `-lncurses -ltinfo`) and carries into
# mutt's final link. Only mutt needs this (mapped via package.env).
LIBS="${LIBS} -ltinfo"
