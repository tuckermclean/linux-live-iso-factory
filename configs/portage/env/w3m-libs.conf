# w3m-0.5.6's old autoconf probes fail their static test-links because they
# don't pull the libraries their targets transitively need:
#  - ncurses: this repo's ncurses is tinfo-split (USE=tinfo), so a bare
#    -lncurses/-lcurses conftest leaves the terminfo symbols unresolved
#    ("checking for tgetent in -lncurses... no"). Same issue as mutt -> -ltinfo.
#  - libgc (dev-libs/boehm-gc): its static archive references atomic ops from
#    dev-libs/libatomic_ops and, on -march=i486 (no cmpxchg8b), gcc's libatomic;
#    the bare "-lgc" conftest ("checking for GC_init in -lgc... no") pulls
#    neither -> add -latomic_ops -latomic. (libatomic.a itself now exists thanks
#    to the cross-gcc EXTRA_ECONF fix; it just isn't auto-linked into a conftest
#    that references it only via libgc.a.)
# Appended to LIBS so each AC_CHECK_LIB test link — and the final link — resolve.
LIBS="${LIBS} -ltinfo -latomic_ops -latomic"
