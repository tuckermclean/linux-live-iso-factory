# x11-apps/xlsfonts links -lX11 (from pkg-config x11), but the all-static rootfs
# links libX11.a — whose xcb_io.o references libxcb/Xau/Xdmcp symbols a static
# libX11.a does NOT auto-pull here (no Libs.private resolution) — so the link
# dies on undefined xcb_take_socket / xcb_poll_for_* / xcb_generate_id / Xau /
# Xdmcp. Append the transitive static X11 chain to LIBS; automake emits $(LIBS)
# AFTER the -lX11 in the program's LDADD, so the -lX11 -lxcb ... order is right.
# Same fix monolith-st/dwm bake in via `pkg-config --static --libs`; xlsfonts is
# a ::gentoo package, so we inject it through package.env (mirrors mutt-tinfo.conf).
LIBS="${LIBS} -lxcb -lXau -lXdmcp"
