# ppp: skip pppd/plugins entirely (--disable-plugins).
#
# Plugins (pppoe.so, radius.so, minconn.so, passwordfd.so, winbind.so,
# pppol2tp.so, pppoatm.so, dhcpv6relay.so) are built as libtool
# "-module -avoid-version" shared objects, dlopen()'d by pppd at runtime.
# They are dead weight on this all-static rootfs (no dynamic loader) even
# before considering whether they'd link under the repo's global -static
# LDFLAGS: coreutils' libstdbuf.so already hit the identical "-static +
# -shared -> undefined reference to `main'" failure class this repo works
# around per-package. --disable-plugins removes pppd/plugins from SUBDIRS
# entirely (upstream Makefile.am: `if PPP_WITH_PLUGINS SUBDIRS += pppd/plugins`)
# — the risk is sidestepped, not patched around. Base pppd/chat/pppdump/
# pppstats are plain automake _PROGRAMS with no libtool involvement, so this
# has zero effect on them; it also drops pppd's own -ldl and -Wl,-E
# (export-dynamic), which pppd/Makefile.am only adds `if PPP_WITH_PLUGINS`.
EXTRA_ECONF="${EXTRA_ECONF} --disable-plugins"
